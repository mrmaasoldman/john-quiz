given orders that if anyone knew where he was, he should let them know, so that they might arrest him."},"12":{"1":"Six days before the Passover, Jesus therefore came to Bethany, where Lazarus was, whom Jesus had raised from the dead.","2":"So they gave a dinner for him there. Martha served, and Lazarus was one of those reclining with him at table.","3":"Mary therefore took a pound of expensive ointment made from pure nard, and anointed the feet of Jesus and wiped his feet with her hair. The house was filled with the fragrance of the perfume.","4":"But Judas Iscariot, one of his disciples (he who was about to betray him), said,","5":"“Why was this ointment not sold for three hundred denarii and given to the poor?”","6":"He said this, not because he cared about the poor, but because he was a thief, and having charge of the moneybag he used to help himself to what was put into it.","7":"Jesus said, “Leave her alone, so that she may keep it for the day of my burial.","8":"For the poor you always have with you, but you do not always have me.”","9":"When the large crowd of the Jews learned that Jesus was there, they came, not only on account of him but also to see Lazarus, whom he had raised from the dead.","10":"So the chief priests made plans to put Lazarus to death as well,","11":"because on account of him many of the Jews were going away and believing in Jesus.","12":"The next day the large crowd that had come to the feast heard that Jesus was coming to Jerusalem.","13":"So they took branches of palm trees and went out to meet him, crying out, “Hosanna! Blessed is he who comes in the name of the Lord, even the King of Israel!”","14":"And Jesus found a young donkey and sat on it, just as it is written,","15":"“Fear not, daughter of Zion; behold, your king is coming, sitting on a donkey’s colt!”","16":"His disciples did not understand these things at first, but when Jesus was glorified, then they remembered that these things had been written about him and had been done to him.","17":"The crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead continued to bear witness.","18":"The reason why the crowd went to meet him was that they heard he had done this sign.","19":"So the Pharisees said to one another, “You see that you are gaining nothing. Look, the world has gone after him.”","20":"Now among those who went up to worship at the feast were some Greeks.","21":"So these came to Philip, who was from Bethsaida in Galilee, and asked him, “Sir, we wish to see Jesus.”","22":"Philip went and told Andrew; Andrew and Philip went and told Jesus.","23":"And Jesus answered them, “The hour has come for the Son of Man to be glorified.","24":"Truly, truly, I say to you, unless a grain of wheat falls into the earth and dies, it remains alone; but if it dies, it bears much fruit.","25":"Whoever loves his life loses it, and whoever hates his life in this world will keep it for eternal life.","26":"If anyone serves me, he must follow me; and where I am, there will my servant be also. If anyone serves me, the Father will honor him.","27":"“Now is my soul troubled. And what shall I say? ‘Father, save me from this hour’? But for this purpose I have come to this hour.","28":"Father, glorify your name.” Then a voice came from heaven: “I have glorified it, and I will glorify it again.”","29":"The crowd that stood there and heard it said that it had thundered. Others said, “An angel has spoken to him.”","30":"Jesus answered, “This voice has come for your sake, not mine.","31":"Now is the judgment of this world; now will the ruler of this world be cast out.","32":"And I, when I am lifted up from the earth, will draw all people to myself.”","33":"He said this to show by what kind of death he was going to die.","34":"So the crowd answered him, “We have heard from the Law that the Christ remains forever. How can you say that the Son of Man must be lifted up? Who is this Son of Man?”","35":"So Jesus said to them, “The light is among you for a little while longer. Walk while you have the light, lest darkness overtake you. The one who walks in the darkness does not know where he is going.","36":"While you have the light, believe in the light, that you may become sons of light.” When Jesus had said these things, he departed and hid himself from them.","37":"Though he had done so many signs before them, they still did not believe in him,","38":"so that the word spoken by the prophet Isaiah might be fulfilled: “Lord, who has believed what he heard from us, and to whom has the arm of the Lord been revealed?”","39":"Therefore they could not believe. For again Isaiah said,","40":"“He has blinded their eyes and hardened their heart, lest they see with their eyes, and understand with their heart, and turn, and I would heal them.”","41":"Isaiah said these things because he saw his glory and spoke of him.","42":"Nevertheless, many even of the authorities believed in him, but for fear of the Pharisees they did not confess it, so that they would not be put out of the synagogue;","43":"for they loved the glory that comes from man more than the glory that comes from God.","44":"And Jesus cried out and said, “Whoever believes in me, believes not in me but in him who sent me.","45":"And whoever sees me sees him who sent me.","46":"I have come into the world as light, so that whoever believes in me may not remain in darkness.","47":"If anyone hears my words and does not keep them, I do not judge him; for I did not come to judge the world but to save the world.","48":"The one who rejects me and does not receive my words has a judge; the word that I have spoken will judge him on the last day.","49":"For I have not spoken on my own authority, but the Father who sent me has himself given me a commandment—what to say and what to speak.","50":"And I know that his commandment is eternal life. What I say, therefore, I say as the Father has told me.”"},"13":{"1":"Now before the Feast of the Passover, when Jesus knew that his hour had come to depart out of this world to the Father, having loved his own who were in the world, he loved them to the end.","2":"During supper, when the devil had already put it into the heart of Judas Iscariot, Simon’s son, to betray him,","3":"Jesus, knowing that the Father had given all things into his hands, and that he had come from God and was going back to God,","4":"rose from supper. He laid aside his outer garments, and taking a towel, tied it around his waist.","5":"Then he poured water into a basin and began to wash the disciples’ feet and to wipe them with the towel that was wrapped around him.","6":"He came to Simon Peter, who said to him, “Lord, do you wash my feet?”","7":"Jesus answered him, “What I am doing you do not understand now, but afterward you will understand.”","8":"Peter said to him, “You shall never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”","9":"Simon Peter said to him, “Lord, not my feet only but also my hands and my head!”","10":"Jesus said to him, “The one who has bathed does not need to wash, except for his feet, but is completely clean. And you are clean, but not every one of you.”","11":"For he knew who was to betray him; that was why he said, “Not all of you are clean.”","12":"When he had washed their feet and put on his outer garments and resumed his place, he said to them, “Do you understand what I have done to you?","13":"You call me Teacher and Lord, and you are right, for so I am.","14":"If I then, your Lord and Teacher, have washed your feet, you also ought to wash one another’s feet.","15":"For I have given you an example, that you also should do just as I have done to you.","16":"Truly, truly, I say to you, a servant is not greater than his master, nor is a messenger greater than the one who sent him.","17":"If you know these things, blessed are you if you do them.","18":"I am not speaking of all of you; I know whom I have chosen. But the Scripture will be fulfilled, ‘He who ate my bread has lifted his heel against me.’","19":"I am telling you this now, before it takes place, that when it does take place you may believe that I am he.","20":"Truly, truly, I say to you, whoever receives the one I send receives me, and whoever receives me receives the one who sent me.”","21":"After saying these things, Jesus was troubled in his spirit, and testified, “Truly, truly, I say to you, one of you will betray me.”","22":"The disciples looked at one another, uncertain of whom he spoke.","23":"One of his disciples, whom Jesus loved, was reclining at table at Jesus’ side,","24":"so Simon Peter motioned to him to ask Jesus of whom he was speaking.","25":"So that disciple, leaning back against Jesus, said to him, “Lord, who is it?”","26":"Jesus answered, “It is he to whom I will give this morsel of bread when I have dipped it.” So when he had dipped the morsel, he gave it to Judas, the son of Simon Iscariot.","27":"Then after he had taken the morsel, Satan entered into him. Jesus said to him, “What you are going to do, do quickly.”","28":"Now no one at the table knew why he said this to him.","29":"Some thought that, because Judas had the moneybag, Jesus was telling him, “Buy what we need for the feast,” or that he should give something to the poor.","30":"So, after receiving the morsel of bread, he immediately went out. And it was night.","31":"When he had gone out, Jesus said, “Now is the Son of Man glorified, and God is glorified in him.","32":"If God is glorified in him, God will also glorify him in himself, and glorify him at once.","33":"Little children, yet a little while I am with you. You will seek me, and just as I said to the Jews, so now I also say to you, ‘Where I am going you cannot come.’","34":"A new commandment I give to you, that you love one another: just as I have loved you, you also are to love one another.","35":"By this all people will know that you are my disciples, if you have love for one another.”","36":"Simon Peter said to him, “Lord, where are you going?” Jesus answered him, “Where I am going you cannot follow me now, but you will follow afterward.”","37":"Peter said to him, “Lord, why can I not follow you now? I will lay down my life for you.”","38":"Jesus answered, “Will you lay down your life for me? Truly, truly, I say to you, the rooster will not crow till you have denied me three times."},"14":{"1":"“Let not your hearts be troubled. Believe in God; believe also in me.","2":"In my Father’s house are many rooms. If it were not so, would I have told you that I go to prepare a place for you?","3":"And if I go and prepare a place for you, I will come again and will take you to myself, that where I am you may be also.","4":"And you know the way to where I am going.”","5":"Thomas said to him, “Lord, we do not know where you are going. How can we know the way?”","6":"Jesus said to him, “I am the way, and the truth, and the life. No one comes to the Father except through me.","7":"If you had known me, you would have known my Father also. From now on you do know him and have seen him.”","8":"Philip said to him, “Lord, show us the Father, and it is enough for us.”","9":"Jesus said to him, “Have I been with you so long, and you still do not know me, Philip? Whoever has seen me has seen the Father. How can you say, ‘Show us the Father’?","10":"Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak on my own authority, but the Father who dwells in me does his works.","11":"Believe me that I am in the Father and the Father is in me, or else believe on account of the works themselves.","12":"“Truly, truly, I say to you, whoever believes in me will also do the works that I do; and greater works than these will he do, because I am going to the Father.","13":"Whatever you ask in my name, this I will do, that the Father may be glorified in the Son.","14":"If you ask me anything in my name, I will do it.","15":"“If you love me, you will keep my commandments.","16":"And I will ask the Father, and he will give you another Helper, to be with you forever,","17":"even the Spirit of truth, whom the world cannot receive, because it neither sees him nor knows him. You know him, for he dwells with you and will be in you.","18":"“I will not leave you as orphans; I will come to you.","19":"Yet a little while and the world will see me no more, but you will see me. Because I live, you also will live.","20":"In that day you will know that I am in my Father, and you in me, and I in you.","21":"Whoever has my commandments and keeps them, he it is who loves me. And he who loves me will be loved by my Father, and I will love him and manifest myself to him.”","22":"Judas (not Iscariot) said to him, “Lord, how is it that you will manifest yourself to us, and not to the world?”","23":"Jesus answered him, “If anyone loves me, he will keep my word, and my Father will love him, and we will come to him and make our home with him.","24":"Whoever does not love me does not keep my words. And the word that you hear is not mine but the Father’s who sent me.","25":"“These things I have spoken to you while I am still with you.","26":"But the Helper, the Holy Spirit, whom the Father will send in my name, he will teach you all things and bring to your remembrance all that I have said to you.","27":"Peace I leave with you; my peace I give to you. Not as the world gives do I give to you. Let not your hearts be troubled, neither let them be afraid.","28":"You heard me say to you, ‘I am going away, and I will come to you.’ If you loved me, you would have rejoiced, because I am going to the Father, for the Father is greater than I.","29":"And now I have told you before it takes place, so that when it does take place you may believe.","30":"I will no longer talk much with you, for the ruler of this world is coming. He has no claim on me,","31":"but I do as the Father has commanded me, so that the world may know that I love the Father. Rise, let us go from here."},"15":{"1":"“I am the true vine, and my Father is the vinedresser.","2":"Every branch in me that does not bear fruit he takes away, and every branch that does bear fruit he prunes, that it may bear more fruit.","3":"Already you are clean because of the word that I have spoken to you.","4":"Abide in me, and I in you. As the branch cannot bear fruit by itself, unless it abides in the vine, neither can you, unless you abide in me.","5":"I am the vine; you are the branches. Whoever abides in me and I in him, he it is that bears much fruit, for apart from me you can do nothing.","6":"If anyone does not abide in me, he is thrown away like a branch and withers; and the branches are gathered, thrown into the fire, and burned.","7":"If you abide in me, and my words abide in you, ask whatever you wish, and it will be done for you.","8":"By this my Father is glorified, that you bear much fruit and so prove to be my disciples.","9":"As the Father has loved me, so have I loved you. Abide in my love.","10":"If you keep my commandments, you will abide in my love, just as I have kept my Father’s commandments and abide in his love.","11":"These things I have spoken to you, that my joy may be in you, and that your joy may be full.","12":"“This is my commandment, that you love one another as I have loved you.","13":"Greater love has no one than this, that someone lay down his life for his friends.","14":"You are my friends if you do what I command you.","15":"No longer do I call you servants, for the servant does not know what his master is doing; but I have called you friends, for all that I have heard from my Father I have made known to you.","16":"You did not choose me, but I chose you and appointed you that you should go and bear fruit and that your fruit should abide, so that whatever you ask the Father in my name, he may give it to you.","17":"These things I command you, so that you will love one another.","18":"“If the world hates you, know that it has hated me before it hated you.","19":"If you were of the world, the world would love you as its own; but because you are not of the world, but I chose you out of the world, therefore the world hates you.","20":"Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me, they will also persecute you. If they kept my word, they will also keep yours.","21":"But all these things they will do to you on account of my name, because they do not know him who sent me.","22":"If I had not come and spoken to them, they would not have been guilty of sin, but now they have no excuse for their sin.","23":"Whoever hates me hates my Father also.","24":"If I had not done among them the works that no one else did, they would not be guilty of sin, but now they have seen and hated both me and my Father.","25":"But the word that is written in their Law must be fulfilled: ‘They hated me without a cause.’","26":"“But when the Helper comes, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father, he will bear witness about me.","27":"And you also will bear witness, because you have been with me from the beginning."},"16":{"1":"“I have said all these things to you to keep you from falling away.","2":"They will put you out of the synagogues. Indeed, the hour is coming when whoever kills you will think he is offering service to God.","3":"And they will do these things because they have not known the Father, nor me.","4":"But I have said these things to you, that when their hour comes you may remember that I told them to you. “I did not say these things to you from the beginning, because I was with you.","5":"But now I am going to him who sent me, and none of you asks me, ‘Where are you going?’","6":"But because I have said these things to you, sorrow has filled your heart.","7":"Nevertheless, I tell you the truth: it is to your advantage that I go away, for if I do not go away, the Helper will not come to you. But if I go, I will send him to you.","8":"And when he comes, he will convict the world concerning sin and righteousness and judgment:","9":"concerning sin, because they do not believe in me;","10":"concerning righteousness, because I go to the Father, and you will see me no longer;","11":"concerning judgment, because the ruler of this world is judged.","12":"“I still have many things to say to you, but you cannot bear them now.","13":"When the Spirit of truth comes, he will guide you into all the truth, for he will not speak on his own authority, but whatever he hears he will speak, and he will declare to you the things that are to come.","14":"He will glorify me, for he will take what is mine and declare it to you.","15":"All that the Father has is mine; therefore I said that he will take what is mine and declare it to you.","16":"“A little while, and you will see me no longer; and again a little while, and you will see me.”","17":"So some of his disciples said to one another, “What is this that he says to us, ‘A little while, and you will not see me, and again a little while, and you will see me’; and, ‘because I am going to the Father’?”","18":"So they were saying, “What does he mean by ‘a little while’? We do not know what he is talking about.”","19":"Jesus knew that they wanted to ask him, so he said to them, “Is this what you are asking yourselves, what I meant by saying, ‘A little while and you will not see me, and again a little while and you will see me’?","20":"Truly, truly, I say to you, you will weep and lament, but the world will rejoice. You will be sorrowful, but your sorrow will turn into joy.","21":"When a woman is giving birth, she has sorrow because her hour has come, but when she has delivered the baby, she no longer remembers the anguish, for joy that a human being has been born into the world.","22":"So also you have sorrow now, but I will see you again, and your hearts will rejoice, and no one will take your joy from you.","23":"In that day you will ask nothing of me. Truly, truly, I say to you, whatever you ask of the Father in my name, he will give it to you.","24":"Until now you have asked nothing in my name. Ask, and you will receive, that your joy may be full.","25":"“I have said these things to you in figures of speech. The hour is coming when I will no longer speak to you in figures of speech but will tell you plainly about the Father.","26":"In that day you will ask in my name, and I do not say to you that I will ask the Father on your behalf;","27":"for the Father himself loves you, because you have loved me and have believed that I came from God.","28":"I came from the Father and have come into the world, and now I am leaving the world and going to the Father.”","29":"His disciples said, “Ah, now you are speaking plainly and not using figurative speech!","30":"Now we know that you know all things and do not need anyone to question you; this is why we believe that you came from God.”","31":"Jesus answered them, “Do you now believe?","32":"Behold, the hour is coming, indeed it has come, when you will be scattered, each to his own home, and will leave me alone. Yet I am not alone, for the Father is with me.","33":"I have said these things to you, that in me you may have peace. In the world you will have tribulation. But take heart; I have overcome the world.”"},"17":{"1":"When Jesus had spoken these words, he lifted up his eyes to heaven, and said, “Father, the hour has come; glorify your Son that the Son may glorify you,","2":"since you have given him authority over all flesh, to give eternal life to all whom you have given him.","3":"And this is eternal life, that they know you, the only true God, and Jesus Christ whom you have sent.","4":"I glorified you on earth, having accomplished the work that you gave me to do.","5":"And now, Father, glorify me in your own presence with the glory that I had with you before the world existed.","6":"“I have manifested your name to the people whom you gave me out of the world. Yours they were, and you gave them to me, and they have kept your word.","7":"Now they know that everything that you have given me is from you.","8":"For I have given them the words that you gave me, and they have received them and have come to know in truth that I came from you; and they have believed that you sent me.","9":"I am praying for them. I am not praying for the world but for those whom you have given me, for they are yours.","10":"All mine are yours, and yours are mine, and I am glorified in them.","11":"And I am no longer in the world, but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given me, that they may be one, even as we are one.","12":"While I was with them, I kept them in your name, which you have given me. I have guarded them, and not one of them has been lost except the son of destruction, that the Scripture might be fulfilled.","13":"But now I am coming to you, and these things I speak in the world, that they may have my joy fulfilled in themselves.","14":"I have given them your word, and the world has hated them because they are not of the world, just as I am not of the world.","15":"I do not ask that you take them out of the world, but that you keep them from the evil one.","16":"They are not of the world, just as I am not of the world.","17":"Sanctify them in the truth; your word is truth.","18":"As you sent me into the world, so I have sent them into the world.","19":"And for their sake I consecrate myself, that they also may be sanctified in truth.","20":"“I do not ask for these only, but also for those who will believe in me through their word,","21":"that they may all be one, just as you, Father, are in me, and I in you, that they also may be in us, so that the world may believe that you have sent me.","22":"The glory that you have given me I have given to them, that they may be one even as we are one,","23":"I in them and you in me, that they may become perfectly one, so that the world may know that you sent me and loved them even as you loved me.","24":"Father, I desire that they also, whom you have given me, may be with me where I am, to see my glory that you have given me because you loved me before the foundation of the world.","25":"O righteous Father, even though the world does not know you, I know you, and these know that you have sent me.","26":"I made known to them your name, and I will continue to make it known, that the love with which you have loved me may be in them, and I in them.”"},"18":{"1":"When Jesus had spoken these words, he went out with his disciples across the brook Kidron, where there was a garden, which he and his disciples entered.","2":"Now Judas, who betrayed him, also knew the place, for Jesus often met there with his disciples.","3":"So Judas, having procured a band of soldiers and some officers from the chief priests and the Pharisees, went there with lanterns and torches and weapons.","4":"Then Jesus, knowing all that would happen to him, came forward and said to them, “Whom do you seek?”","5":"They answered him, “Jesus of Nazareth.” Jesus said to them, “I am he.” Judas, who betrayed him, was standing with them.","6":"When Jesus said to them, “I am he,” they drew back and fell to the ground.","7":"So he asked them again, “Whom do you seek?” And they said, “Jesus of Nazareth.”","8":"Jesus answered, “I told you that I am he. So, if you seek me, let these men go.”","9":"This was to fulfill the word that he had spoken: “Of those whom you gave me I have lost not one.”","10":"Then Simon Peter, having a sword, drew it and struck the high priest’s servant and cut off his right ear. (The servant’s name was Malchus.)","11":"So Jesus said to Peter, “Put your sword into its sheath; shall I not drink the cup that the Father has given me?”","12":"So the band of soldiers and their captain and the officers of the Jews arrested Jesus and bound him.","13":"First they led him to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.","14":"It was Caiaphas who had advised the Jews that it would be expedient that one man should die for the people.","15":"Simon Peter followed Jesus, and so did another disciple. Since that disciple was known to the high priest, he entered with Jesus into the courtyard of the high priest,","16":"but Peter stood outside at the door. So the other disciple, who was known to the high priest, went out and spoke to the servant girl who kept watch at the door, and brought Peter in.","17":"The servant girl at the door said to Peter, “You also are not one of this man’s disciples, are you?” He said, “I am not.”","18":"Now the servants and officers had made a charcoal fire, because it was cold, and they were standing and warming themselves. Peter also was with them, standing and warming himself.","19":"The high priest then questioned Jesus about his disciples and his teaching.","20":"Jesus answered him, “I have spoken openly to the world. I have always taught in synagogues and in the temple, where all Jews come together. I have said nothing in secret.","21":"Why do you ask me? Ask those who have heard me what I said to them; they know what I said.”","22":"When he had said these things, one of the officers standing by struck Jesus with his hand, saying, “Is that how you answer the high priest?”","23":"Jesus answered him, “If what I said is wrong, bear witness about the wrong; but if what I said is right, why do you strike me?”","24":"Annas then sent him bound to Caiaphas the high priest.","25":"Now Simon Peter was standing and warming himself. So they said to him, “You also are not one of his disciples, are you?” He denied it and said, “I am not.”","26":"One of the servants of the high priest, a relative of the man whose ear Peter had cut off, asked, “Did I not see you in the garden with him?”","27":"Peter again denied it, and at once a rooster crowed.","28":"Then they led Jesus from the house of Caiaphas to the governor’s headquarters. It was early morning. They themselves did not enter the governor’s headquarters, so that they would not be defiled, but could eat the Passover.","29":"So Pilate went outside to them and said, “What accusation do you bring against this man?”","30":"They answered him, “If this man were not doing evil, we would not have delivered him over to you.”","31":"Pilate said to them, “Take him yourselves and judge him by your own law.” The Jews said to him, “It is not lawful for us to put anyone to death.”","32":"This was to fulfill the word that Jesus had spoken to show by what kind of death he was going to die.","33":"So Pilate entered his headquarters again and called Jesus and said to him, “Are you the King of the Jews?”","34":"Jesus answered, “Do you say this of your own accord, or did others say it to you about me?”","35":"Pilate answered, “Am I a Jew? Your own nation and the chief priests have delivered you over to me. What have you done?”","36":"Jesus answered, “My kingdom is not of this world. If my kingdom were of this world, my servants would have been fighting, that I might not be delivered over to the Jews. But my kingdom is not from the world.”","37":"Then Pilate said to him, “So you are a king?” Jesus answered, “You say that I am a king. For this purpose I was born and for this purpose I have come into the world—to bear witness to the truth. Everyone who is of the truth listens to my voice.”","38":"Pilate said to him, “What is truth?” After he had said this, he went back outside to the Jews and told them, “I find no guilt in him.","39":"But you have a custom that I should release one man for you at the Passover. So do you want me to release to you the King of the Jews?”","40":"They cried out again, “Not this man, but Barabbas!” Now Barabbas was a robber."},"19":{"1":"Then Pilate took Jesus and flogged him.","2":"And the soldiers twisted together a crown of thorns and put it on his head and arrayed him in a purple robe.","3":"They came up to him, saying, “Hail, King of the Jews!” and struck him with their hands.","4":"Pilate went out again and said to them, “See, I am bringing him out to you that you may know that I find no guilt in him.”","5":"So Jesus came out, wearing the crown of thorns and the purple robe. Pilate said to them, “Behold the man!”","6":"When the chief priests and the officers saw him, they cried out, “Crucify him, crucify him!” Pilate said to them, “Take him yourselves and crucify him, for I find no guilt in him.”","7":"The Jews answered him, “We have a law, and according to that law he ought to die because he has made himself the Son of God.”","8":"When Pilate heard this statement, he was even more afraid.","9":"He entered his headquarters again and said to Jesus, “Where are you from?” But Jesus gave him no answer.","10":"So Pilate said to him, “You will not speak to me? Do you not know that I have authority to release you and authority to crucify you?”","11":"Jesus answered him, “You would have no authority over me at all unless it had been given you from above. Therefore he who delivered me over to you has the greater sin.”","12":"From then on Pilate sought to release him, but the Jews cried out, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king opposes Caesar.”","13":"So when Pilate heard these words, he brought Jesus out and sat down on the judgment seat at a place called The Stone Pavement, and in Aramaic Gabbatha.","14":"Now it was the day of Preparation of the Passover. It was about the sixth hour. He said to the Jews, “Behold your King!”","15":"They cried out, “Away with him, away with him, crucify him!” Pilate said to them, “Shall I crucify your King?” The chief priests answered, “We have no king but Caesar.”","16":"So he delivered him over to them to be crucified. So they took Jesus,","17":"and he went out, bearing his own cross, to the place called The Place of a Skull, which in Aramaic is called Golgotha.","18":"There they crucified him, and with him two others, one on either side, and Jesus between them.","19":"Pilate also wrote an inscription and put it on the cross. It read, “Jesus of Nazareth, the King of the Jews.”","20":"Many of the Jews read this inscription, for the place where Jesus was crucified was near the city, and it was written in Aramaic, in Latin, and in Greek.","21":"So the chief priests of the Jews said to Pilate, “Do not write, ‘The King of the Jews,’ but rather, ‘This man said, I am King of the Jews.’”","22":"Pilate answered, “What I have written I have written.”","23":"When the soldiers had crucified Jesus, they took his garments and divided them into four parts, one part for each soldier; also his tunic. But the tunic was seamless, woven in one piece from top to bottom,","24":"so they said to one another, “Let us not tear it, but cast lots for it to see whose it shall be.” This was to fulfill the Scripture which says, “They divided my garments among them, and for my clothing they cast lots.” So the soldiers did these things,","25":"but standing by the cross of Jesus were his mother and his mother’s sister, Mary the wife of Clopas, and Mary Magdalene.","26":"When Jesus saw his mother and the disciple whom he loved standing nearby, he said to his mother, “Woman, behold, your son!”","27":"Then he said to the disciple, “Behold, your mother!” And from that hour the disciple took her to his own home.","28":"After this, Jesus, knowing that all was now finished, said (to fulfill the Scripture), “I thirst.”","29":"A jar full of sour wine stood there, so they put a sponge full of the sour wine on a hyssop branch and held it to his mouth.","30":"When Jesus had received the sour wine, he said, “It is finished,” and he bowed his head and gave up his spirit.","31":"Since it was the day of Preparation, and so that the bodies would not remain on the cross on the Sabbath (for that Sabbath was a high day), the Jews asked Pilate that their legs might be broken and that they might be taken away.","32":"So the soldiers came and broke the legs of the first, and of the other who had been crucified with him.","33":"But when they came to Jesus and saw that he was already dead, they did not break his legs.","34":"But one of the soldiers pierced his side with a spear, and at once there came out blood and water.","35":"He who saw it has borne witness—his testimony is true, and he knows that he is telling the truth—that you also may believe.","36":"For these things took place that the Scripture might be fulfilled: “Not one of his bones will be broken.”","37":"And again another Scripture says, “They will look on him whom they have pierced.”","38":"After these things Joseph of Arimathea, who was a disciple of Jesus, but secretly for fear of the Jews, asked Pilate that he might take away the body of Jesus, and Pilate gave him permission. So he came and took away his body.","39":"Nicodemus also, who earlier had come to Jesus by night, came bringing a mixture of myrrh and aloes, about seventy-five pounds in weight.","40":"So they took the body of Jesus and bound it in linen cloths with the spices, as is the burial custom of the Jews.","41":"Now in the place where he was crucified there was a garden, and in the garden a new tomb in which no one had yet been laid.","42":"So because of the Jewish day of Preparation, since the tomb was close at hand, they laid Jesus there."},"20":{"1":"Now on the first day of the week Mary Magdalene came to the tomb early, while it was still dark, and saw that the stone had been taken away from the tomb.","2":"So she ran and went to Simon Peter and the other disciple, the one whom Jesus loved, and said to them, “They have taken the Lord out of the tomb, and we do not know where they have laid him.”","3":"So Peter went out with the other disciple, and they were going toward the tomb.","4":"Both of them were running together, but the other disciple outran Peter and reached the tomb first.","5":"And stooping to look in, he saw the linen cloths lying there, but he did not go in.","6":"Then Simon Peter came, following him, and went into the tomb. He saw the linen cloths lying there,","7":"and the face cloth, which had been on Jesus’ head, not lying with the linen cloths but folded up in a place by itself.","8":"Then the other disciple, who had reached the tomb first, also went in, and he saw and believed;","9":"for as yet they did not understand the Scripture, that he must rise from the dead.","10":"Then the disciples went back to their homes.","11":"But Mary stood weeping outside the tomb, and as she wept she stooped to look into the tomb.","12":"And she saw two angels in white, sitting where the body of Jesus had lain, one at the head and one at the feet.","13":"They said to her, “Woman, why are you weeping?” She said to them, “They have taken away my Lord, and I do not know where they have laid him.”","14":"Having said this, she turned around and saw Jesus standing, but she did not know that it was Jesus.","15":"Jesus said to her, “Woman, why are you weeping? Whom are you seeking?” Supposing him to be the gardener, she said to him, “Sir, if you have carried him away, tell me where you have laid him, and I will take him away.”","16":"Jesus said to her, “Mary.” She turned and said to him in Aramaic, “Rabboni!” (which means Teacher).","17":"Jesus said to her, “Do not cling to me, for I have not yet ascended to the Father; but go to my brothers and say to them, ‘I am ascending to my Father and your Father, to my God and your God.’”","18":"Mary Magdalene went and announced to the disciples, “I have seen the Lord”—and that he had said these things to her.","19":"On the evening of that day, the first day of the week, the doors being locked where the disciples were for fear of the Jews, Jesus came and stood among them and said to them, “Peace be with you.”","20":"When he had said this, he showed them his hands and his side. Then the disciples were glad when they saw the Lord.","21":"Jesus said to them again, “Peace be with you. As the Father has sent me, even so I am sending you.”","22":"And when he had said this, he breathed on them and said to them, “Receive the Holy Spirit.","23":"If you forgive the sins of any, they are forgiven them; if you withhold forgiveness from any, it is withheld.”","24":"Now Thomas, one of the twelve, called the Twin, was not with them when Jesus came.","25":"So the other disciples told him, “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and place my finger into the mark of the nails, and place my hand into his side, I will never believe.”","26":"Eight days later, his disciples were inside again, and Thomas was with them. Although the doors were locked, Jesus came and stood among them and said, “Peace be with you.”","27":"Then he said to Thomas, “Put your finger here, and see my hands; and put out your hand, and place it in my side. Do not disbelieve, but believe.”","28":"Thomas answered him, “My Lord and my God!”","29":"Jesus said to him, “Have you believed because you have seen me? Blessed are those who have not seen and yet have believed.”","30":"Now Jesus did many other signs in the presence of the disciples, which are not written in this book;","31":"but these are written so that you may believe that Jesus is the Christ, the Son of God, and that by believing you may have life in his name."},"21":{"1":"After this Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.","2":"Simon Peter, Thomas (called the Twin), Nathanael of Cana in Galilee, the sons of Zebedee, and two others of his disciples were together.","3":"Simon Peter said to them, “I am going fishing.” They said to him, “We will go with you.” They went out and got into the boat, but that night they caught nothing.","4":"Just as day was breaking, Jesus stood on the shore; yet the disciples did not know that it was Jesus.","5":"Jesus said to them, “Children, do you have any fish?” They answered him, “No.”","6":"He said to them, “Cast the net on the right side of the boat, and you will find some.” So they cast it, and now they were not able to haul it in, because of the quantity of fish.","7":"That disciple whom Jesus loved therefore said to Peter, “It is the Lord!” When Simon Peter heard that it was the Lord, he put on his outer garment, for he was stripped for work, and threw himself into the sea.","8":"The other disciples came in the boat, dragging the net full of fish, for they were not far from the land, but about a hundred yards off.","9":"When they got out on land, they saw a charcoal fire in place, with fish laid out on it, and bread.","10":"Jesus said to them, “Bring some of the fish that you have just caught.”","11":"So Simon Peter went aboard and hauled the net ashore, full of large fish, 153 of them. And although there were so many, the net was not torn.","12":"Jesus said to them, “Come and have breakfast.” Now none of the disciples dared ask him, “Who are you?” They knew it was the Lord.","13":"Jesus came and took the bread and gave it to them, and so with the fish.","14":"This was now the third time that Jesus was revealed to the disciples after he was raised from the dead.","15":"When they had finished breakfast, Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him, “Feed my lambs.”","16":"He said to him a second time, “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him, “Tend my sheep.”","17":"He said to him the third time, “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” and he said to him, “Lord, you know everything; you know that I love you.” Jesus said to him, “Feed my sheep.","18":"Truly, truly, I say to you, when you were young, you used to dress yourself and walk wherever you wanted, but when you are old, you will stretch out your hands, and another will dress you and carry you where you do not want to go.”","19":"(This he said to show by what kind of death he was to glorify God.) And after saying this he said to him, “Follow me.”","20":"Peter turned and saw the disciple whom Jesus loved following them, the one who also had leaned back against him during the supper and had said, “Lord, who is it that is going to betray you?”","21":"When Peter saw him, he said to Jesus, “Lord, what about this man?”","22":"Jesus said to him, “If it is my will that he remain until I come, what is that to you? You follow me!”","23":"So the saying spread abroad among the brothers that this disciple was not to die; yet Jesus did not say to him that he was not to die, but, “If it is my will that he remain until I come, what is that to you?”","24":"This is the disciple who is bearing witness about these things, and who has written these things, and we know that his testimony is true.","25":"Now there are also many other things that Jesus did. Were every one of them to be written, I suppose that the world itself could not contain the books that would be written."}}</script>
<script>
(function(){
"use strict";
const RAW = JSON.parse(document.getElementById('qdata').textContent);
// Q: {id,c,v,q,aq,a}
const Q = RAW.map((x,i)=>({id:i,c:x.c,v:x.v,q:x.q,aq:x.aq,a:x.a}));
const VERSES_IN_JOHN=[51,25,36,54,47,71,53,59,41,42,57,50,38,31,27,33,26,40,42,31,25];
const TOTAL_VERSES = VERSES_IN_JOHN.reduce((a,b)=>a+b,0);
// verses that have questions
const qVerses = {}; // c -> sorted array of v
Q.forEach(q=>{ (qVerses[q.c] ||= new Set()).add(q.v); });
for(const c in qVerses) qVerses[c]=[...qVerses[c]].sort((a,b)=>a-b);
const CH = Object.keys(qVerses).map(Number).sort((a,b)=>a-b);
const byVerse = {}; Q.forEach(q=>{ (byVerse[q.c+':'+q.v] ||= []).push(q.id); });
const qCountCh = {}; Q.forEach(q=>qCountCh[q.c]=(qCountCh[q.c]||0)+1);

/* ---------- storage ---------- */
const K='johnquiz:';
function lsGet(k,d){try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(K+k,JSON.stringify(v));return true}catch(e){return false}}
function blankUser(){return {stats:{},mem:{},sessions:[],sel:['1:'+qVerses[1].join(',1:')].join('').split(','),opts:{order:'order',limit:'all',pool:'all',memOnly:false,mix:false,words:'all',answer:'type',timer:'off'},vopts:{from:'goal',order:'shuffle',limit:'25',mode:'type',vsel:[],kind:'ref',timer:'off'},vstats:{},rstats:{},counts:{},badges:{}}}
let users = lsGet('users',[]);

function loadUser(name){ me=name; U=Object.assign(blankUser(),lsGet('u:'+name,{})); U.opts=Object.assign(blankUser().opts,U.opts||{}); U.vopts=Object.assign(blankUser().vopts,U.vopts||{});if(U.vopts.chs){U.vopts.vsel=[...new Set([...(U.vopts.vsel||[]),...U.vopts.chs.flatMap(c=>allVerses(c).map(v=>c+':'+v))])];delete U.vopts.chs} U.vstats=U.vstats||{};U.rstats=U.rstats||{};U.counts=U.counts||{};U.badges=U.badges||{}; if(!users.includes(name)){users.push(name);lsSet('users',users)} lsSet('last',name); pullCloud(); applyTheme(); if(mus.playing) musicStart(); setTimeout(applyFreezes,300); sheetLast=''; scheduleSheet(); }
function save(){ if(!me) return; U.saved=Date.now(); lsSet('u:'+me,U); scheduleSync(); scheduleSheet(); }

/* ---------- grading ---------- */
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/&/g,' and ').replace(/[^a-z0-9' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim()}
function variants(ans){
  const parts=[]; let last=0; const re=/\(([^()]*)\)/g; let m;
  while((m=re.exec(ans))){ if(m.index>last) parts.push({t:ans.slice(last,m.index),o:false}); parts.push({t:m[1],o:true}); last=re.lastIndex; }
  if(last<ans.length) parts.push({t:ans.slice(last),o:false});
  const opt=parts.filter(p=>p.o).length; const out=new Set();
  const n=Math.min(opt,8);
  for(let mask=0;mask<(1<<n);mask++){ let k=0,s='';
    for(const p of parts){ if(p.o){ const inc = k<n ? (mask>>k)&1 : 1; k++; if(inc) s+=' '+p.t+' '; } else s+=p.t; }
    out.add(norm(s)); }
  return [...out];
}
function lev(a,b){ if(a===b)return 0; const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=new Array(n+1); for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){const cur=[i]; for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))} prev=cur} return prev[n]; }
function grade(q,typed){ return matchText(q.a,typed) }
function gradeQuestion(wording,shownWords,rest){
  // accept either the remaining words or the whole question retyped
  const shown=shownWords.join(' ');
  const r1=matchText([wording],shown+' '+rest), r2=matchText([wording],rest);
  // exact wording only: in quizzing, 'say' vs 'said' is a different question
  return r1==='right'||r2==='right'?'right':'wrong';
}
function matchText(targets,typed){
  const t=norm(typed); if(!t) return 'wrong';
  const all=targets.flatMap(variants);
  if(all.includes(t)) return 'right';
  let best=1e9,len=1; for(const v of all){const d=lev(t,v); if(d<best){best=d;len=v.length}}
  const allow = len<=4?0 : len<=12?1 : Math.floor(len/14)+1;
  return best<=allow ? 'close' : 'wrong';
}
window.__grade = (id,s)=>grade(Q[id],s); // for testing

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtQ(s){ return esc(s).replace(/\(([^()]*)\)/g,'<span class="opt-words">($1)</span>') }
// Quizmaster style: "According to 6:1, what did ..."
function withRef(c,v,html){ return `<span class="qref">According to ${c}:${v},</span> `+html.replace(/^([A-Z])(?=[a-z])/,m=>m.toLowerCase()); }
function pct(n,d){return d?Math.round(100*n/d):0}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selSet(){return new Set(U.sel)}
const allVerses=c=>(c>=1&&c<=21)?Array.from({length:VERSES_IN_JOHN[c-1]},(_,k)=>k+1):undefined;
function rangeLabel(sel,versesOf=c=>qVerses[c]){
  // compress selected verses into "1:1-14, 3"
  const byC={}; sel.forEach(k=>{const [c,v]=k.split(':').map(Number);(byC[c] ||= []).push(v)});
  const out=[]; Object.keys(byC).map(Number).sort((a,b)=>a-b).forEach(c=>{
    const vs=byC[c].sort((a,b)=>a-b);
    if(vs.length===versesOf(c).length){out.push(String(c));return}
    let s=vs[0],p=vs[0]; const segs=[];
    const idx=v=>versesOf(c).indexOf(v);
    for(let i=1;i<=vs.length;i++){ const v=vs[i]; if(v!==undefined && idx(v)===idx(p)+1){p=v;continue} segs.push(s===p?`${s}`:`${s}-${p}`); s=p=v; }
    out.push(c+':'+segs.join(','));
  });
  return out.join('; ')||'nothing';

  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), cols=['--accent','--accent2','--gold','--good'].map(v=>cs.getPropertyValue(v).trim()||'#888');
  const N=big?220:110, parts=[];

  for(let i=0;i<N;i++){const fromSide=big&&i%2; parts.push({x:fromSide?(i%4===1?0:W):r.left+r.width/2,y:fromSide?H*.6:r.top+40,

    for(const p of parts){p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr; ctx.save();ctx.globalAlpha=fade;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;

const DAILY=30;
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shiftDay(k,n){const [y,m,d]=k.split('-').map(Number);return dayKey(new Date(y,m-1,d+n))}
function goalDaysOf(days){const fz=(typeof U!=='undefined'&&U&&days===U.days&&U.frozen)?Object.keys(U.frozen):[];return [...new Set([...Object.keys(days||{}).filter(k=>days[k]>=DAILY),...fz])].sort()}
function streakFrom(goalDays){
  const set=new Set(goalDays), today=dayKey(); let k=set.has(today)?today:shiftDay(today,-1), n=0;
  while(set.has(k)){n++;k=shiftDay(k,-1)}
  let best=0,run=0,prev=null; goalDays.forEach(d=>{run=(prev&&shiftDay(prev,1)===d)?run+1:1;best=Math.max(best,run);prev=d});
  return {streak:n,best};
}
function todayCount(){return (U&&U.days&&U.days[dayKey()])||0}
let goalJustHit=false;
function bumpDay(){ U.days=U.days||{}; const k=dayKey(), before=U.days[k]||0; U.days[k]=before+1; if(before+1===DAILY) goalJustHit=true;
  const keys=Object.keys(U.days).sort(); if(keys.length>120) keys.slice(0,keys.length-120).forEach(x=>delete U.days[x]); }
const toastQ=[]; let toastBusy=false;
function toast(html){ toastQ.push(html); if(!toastBusy) nextToast(); }
function nextToast(){ const html=toastQ.shift(); if(!html){toastBusy=false;return} toastBusy=true; const t=document.createElement('div'); t.className='toast'; t.innerHTML=html; document.body.appendChild(t); setTimeout(()=>{t.remove();nextToast()},3400); }
function checkDailyGoal(){ if(!goalJustHit) return; goalJustHit=false; const {streak}=streakFrom(goalDaysOf(U.days)); maybeAwardFreeze(streak); gainXP(25);
  setTimeout(()=>{ celebrate(true); toast(`<b>Daily goal smashed!</b><span>${DAILY} questions today · ${streak}-day streak${streak>1?'. Keep it rolling!':'. Day one of something great.'}</span>`); },500); }
function dayPill(){ if(!U) return ''; const {streak}=streakFrom(goalDaysOf(U.days)), t=todayCount(), done=t>=DAILY;
  return `<span class="daypill ${done?'done':''}" title="Days in a row with at least ${DAILY} questions"><i aria-hidden="true">🔥</i>${streak}<span class="daytoday">${done?'✓':Math.min(t,DAILY)+'/'+DAILY}</span></span>`; }

// Spaced repetition: each question's run of right answers (st[4]) sets how long until it is due again.
const REVIEW_DAYS=[0,1,3,7,14,30,60,120];
function isDue(st,now){ if(!st) return false; if(st[2]===0) return true; const days=REVIEW_DAYS[Math.min(st[4]||1,REVIEW_DAYS.length-1)]; return now-(st[3]||0)>=days*864e5; }
function reviewGroups(ids){ const now=Date.now(), missed=[], due=[], fresh=[];
  ids.forEach(id=>{const st=U.stats[id]; if(!st) fresh.push(id); else if(st[2]===0) missed.push(id); else if(isDue(st,now)) due.push(id);});
  missed.sort((a,b)=>U.stats[a][3]-U.stats[b][3]);
  due.sort((a,b)=>{const over=id=>(now-U.stats[id][3])/(REVIEW_DAYS[Math.min(U.stats[id][4]||1,REVIEW_DAYS.length-1)]*864e5||1);return over(b)-over(a)});
  return {missed,due,fresh}; }
function buildPool(){
  const s=selSet(), o=U.opts; let ids=[];
  for(const k of s){ if(o.memOnly && !U.mem[k]) continue; (byVerse[k]||[]).forEach(id=>ids.push(id)); }
  if(o.pool==='missed') ids=ids.filter(id=>{const st=U.stats[id];return st && st[1]<st[0]});
  if(o.pool==='last') ids=ids.filter(id=>{const st=U.stats[id];return st && st[2]===0});
  if(o.pool==='new') ids=ids.filter(id=>!U.stats[id]);
  ids.sort((a,b)=>a-b);
  if(o.pool==='review'){ const g=reviewGroups(ids); if(o.order==='shuffle'){shuffle(g.missed);shuffle(g.due);shuffle(g.fresh)} ids=[...g.missed,...g.due,...g.fresh]; }
  else if(o.order==='shuffle') shuffle(ids);
  if(o.limit!=='all') ids=ids.slice(0,+o.limit);
  return ids;

function parseRange(str,versesOf=c=>qVerses[c]){
  const out=new Set(); const errs=[];
  str.split(/[,;]+/).map(x=>x.trim()).filter(Boolean).forEach(seg=>{
    seg=seg.replace(/^john\s*/i,'');
    let m;
    const add=(c,v1,v2)=>{ const vs=versesOf(c); if(!vs){errs.push(seg);return} vs.forEach(v=>{if(v>=v1&&v<=v2)out.add(c+':'+v)}) };
    if((m=seg.match(/^(\d+)$/))) add(+m[1],1,999);
    else if((m=seg.match(/^(\d+)\s*-\s*(\d+)$/))) { for(let c=+m[1];c<=+m[2];c++) add(c,1,999) }
    else if((m=seg.match(/^(\d+):(\d+)$/))) add(+m[1],+m[2],+m[2]);
    else if((m=seg.match(/^(\d+):(\d+)\s*-\s*(\d+)$/))) add(+m[1],+m[2],+m[3]);
    else if((m=seg.match(/^(\d+):(\d+)\s*-\s*(\d+):(\d+)$/))) { const c1=+m[1],c2=+m[3]; for(let c=c1;c<=c2;c++) add(c, c===c1?+m[2]:1, c===c2?+m[4]:999) }
    else errs.push(seg);
  });
  return {out,errs};
}

const b64ToBytes=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
function bytesToB64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function packCode(){ const json=JSON.stringify({n:me,u:U});
  if(typeof CompressionStream==='undefined') return codeFor();
  const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); return 'JQZ1:'+bytesToB64(new Uint8Array(buf)); }
async function unpackCode(raw){ const s=String(raw||'').replace(/\s+/g,'');
  if(s.startsWith('JQZ1:')){ const txt=await new Response(new Blob([b64ToBytes(s.slice(5))]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); const d=JSON.parse(txt); if(!d.u||!d.u.stats) throw 0; return d; }
  const d=JSON.parse(decodeURIComponent(escape(atob(s)))); if(!d.u||!d.u.stats) throw 0; return d; }

    if(m){exp=m[1];return tok.slice(1)}
    m=tok.match(/^([a-z])([a-z’']+)/);

const MUSIC_VOL={low:.25,med:.5,high:.85};

const musicOn=()=>lsGet('music',false)===true;
const musicVol=()=>MUSIC_VOL[lsGet('musicvol','med')]||.5;
function musicOpen(t){ if(!t.need) return true; if(!U) return false; const n=t.need;
  if(n.level) return levelOf(U.xp).level>=n.level; if(n.bosses) return Object.keys(U.bosses||{}).length>=n.bosses; if(n.speed) return ((U.hs&&U.hs.speed)||0)>=n.speed; return false; }

function musicSetup(){ if(mus.el) return; mus.el=new Audio(); mus.el.loop=true; mus.el.preload='none';
  const a=ac(); if(a){ try{ const node=a.createMediaElementSource(mus.el); mus.gain=a.createGain(); mus.gain.gain.value=musicVol(); node.connect(mus.gain); mus.gain.connect(a.destination); }catch(e){ mus.gain=null; } } }
function setMusicLevel(v){ if(mus.gain){ try{ mus.gain.gain.setTargetAtTime(v,ac().currentTime,.08); }catch(e){} } else if(mus.el){ mus.el.volume=Math.min(1,v); } }
function musicStart(){ if(!U) return; musicSetup(); const t=currentTrack(); mus.track=t;
  if(mus.src!==t.file){ mus.el.src=t.file; mus.src=t.file; }
  setMusicLevel(musicVol()); mus.playing=true; ac();
  const p=mus.el.play(); if(p&&p.catch) p.catch(()=>{ mus.playing=false; if(tab==='progress') renderKeep(); }); }
function musicStop(){ mus.playing=false; if(mus.el){ try{ mus.el.pause(); }catch(e){} } }
function duckMusic(on){ if(mus.playing) setMusicLevel(on?musicVol()*.25:musicVol()); }
function setMusic(on){ lsSet('music',!!on); if(on) musicStart(); else musicStop(); }

['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ if(musicOn()&&U&&!mus.playing&&document.visibilityState==='visible') musicStart(); },{passive:true}));

const TITLES=['Scroll Rookie','Verse Seeker','Page Turner','Parable Pro','Jump Starter','Buzzer Beater','Scripture Sharpshooter','Quiz Apostle','Gospel Guru','Word Warrior','Fisher of Answers','Lamp Bearer','Vine Keeper','Shepherd\'s Voice','Living Water','Bread of Life Scholar','Light of the World','Door Keeper','Good Shepherd\'s Flock','Resurrection Runner','Way Walker','Truth Teller','Life Giver','Glory Seeker','Overcomer','Witness','Beloved Disciple','Scroll Master','Gospel Champion','Legend of John'];

function levelOf(xp){ xp=xp||0; let L=1; while(xp>=lvlNeed(L+1)) L++; const title=TITLES[Math.min(L,TITLES.length)-1]+(L>TITLES.length?' ★'+(L-TITLES.length):'');
  return {level:L,title,into:xp-lvlNeed(L),span:lvlNeed(L+1)-lvlNeed(L)}; }
function gainXP(n){ if(!U||!n) return; const before=levelOf(U.xp).level; U.xp=(U.xp||0)+n;
  U.xpDays=U.xpDays||{}; const dk=dayKey(); U.xpDays[dk]=(U.xpDays[dk]||0)+n; const ks=Object.keys(U.xpDays).sort(); if(ks.length>40) ks.slice(0,ks.length-40).forEach(k=>delete U.xpDays[k]); const after=levelOf(U.xp);
  if(after.level>before){ setTimeout(()=>{ sfx('level'); celebrate(true); toast(`<b>Level up! Level ${after.level}</b><span>You are now a ${esc(after.title)}.${themeUnlockedAt(after.level)}${(()=>{const t=TRACKS.find(x=>x.need&&x.need.level===after.level);return t?` New music unlocked: ${t.name}!`:''})()}</span>`); checkBadges(); },900); } }
function lvlChip(){ if(!U) return ''; const l=levelOf(U.xp); return `<span class="lvlchip" title="${esc(l.title)} · ${U.xp||0} XP">Lv ${l.level}</span>`; }

/* ---------- streak freezes ---------- */
function applyFreezes(){
  if(!U) return; U.frozen=U.frozen||{}; const today=dayKey(), yest=shiftDay(today,-1);
  const kept=new Set([...Object.keys(U.days||{}).filter(k=>U.days[k]>=DAILY),...Object.keys(U.frozen)]);
  if(kept.has(yest)||!(U.freezes>0)) return;
  let last=null; for(let i=2;i<=60;i++){ const k=shiftDay(today,-i); if(kept.has(k)){last=k;break} }
  if(!last) return;
  const gap=[]; for(let k=shiftDay(last,1);k<=yest;k=shiftDay(k,1)) gap.push(k);
  if(!gap.length||gap.length>U.freezes) return;
  let run=0; for(let k=last;kept.has(k);k=shiftDay(k,-1)) run++;
  gap.forEach(k=>U.frozen[k]=1); U.freezes-=gap.length; save();
  setTimeout(()=>toast(`<b>❄️ Streak saved!</b><span>${gap.length>1?gap.length+' streak freezes':'A streak freeze'} kept your ${run}-day streak alive.</span>`),600);
}
function maybeAwardFreeze(streak){ if(streak>0&&streak%7===0){ const before=U.freezes||0; if(before<3){ U.freezes=before+1; U.counts=U.counts||{}; U.counts.freezes=(U.counts.freezes||0)+1; save();
  setTimeout(()=>toast(`<b>❄️ Streak freeze earned!</b><span>${streak} days in a row. If you miss a day, a freeze saves your streak. You have ${U.freezes}.</span>`),2400); } } }

/* ---------- games ---------- */
let game=null, duelNames=['Player 1','Player 2'], duelTarget=5;
const BOSSES=[['🌑','The Darkness'],['🏺','The Empty Wine Jar'],['🌙','Night Visitor'],['🪣','The Deep Well'],['🌊','The Troubled Pool'],['🍞','Five-Loaf Phantom'],['⛺','Booth Brute'],['🔍','The Fault Finder'],['🟫','The Mud Monster'],['🐺','The Wolf'],['🪦','The Sealed Tomb'],['🌾','The Grain of Wheat'],['🧼','Towel Titan'],['🚪','Many-Rooms Maze'],['🥀','The Withered Branch'],['⛈️','The Sorrow Storm'],['✨','Glory Guardian'],['🐓','The Rooster'],['🎲','Soldiers\' Dice'],['🪨','The Rolled Stone'],['🐟','153 Fish']];
const BOSS_HP=12, HEARTS=3;
function gPool(){ const ids=[]; selSet().forEach(k=>(byVerse[k]||[]).forEach(id=>ids.push(id))); return ids.length?ids:Q.map(q=>q.id); }
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
// Daily Challenge draws only from the verses this student has marked memorized, so each student's challenge is their own.
function memQuestionIds(){ const ids=[]; Object.keys(U.mem||{}).forEach(k=>(byVerse[k]||[]).forEach(id=>ids.push(id))); return ids.sort((a,b)=>a-b); }
function dailyIds(day){ const pool=memQuestionIds(), n=Math.min(10,pool.length), r=mulberry(hashStr('johnquiz-daily-'+day+'-'+(me||''))), ids=[];
  while(ids.length<n){ const id=pool[Math.floor(r()*pool.length)]; if(!ids.includes(id)) ids.push(id); } return ids; }
const thinking=()=>U.opts.answer==='think';

function gNewQ(id){ game.cur={id,state:'ask',ok:null,typed:'',marked:false,msg:'',shown:startWords(),dq:'',da:''}; }
function gWords(){ return Q[game.cur.id].q.split(/\s+/).filter(Boolean); }
function gPartial(){ const c=game.cur; return c.state==='ask'&&c.shown<gWords().length; }
function gQText(){ const c=game.cur, w=gWords(), q=Q[c.id]; return withRef(q.c,q.v, gPartial() ? esc(w.slice(0,c.shown).join(' '))+' <span class="more">…</span>' : fmtQ(q.q)+'?'); }
function gAddWord(){ const c=game&&game.cur; if(!c||!gPartial()) return; const a=$('#gans'), r=$('#grest'); if(a)c.da=a.value; if(r)c.dq=r.value; c.shown++; if(!gPartial()) c.dq=''; render(); const t=$('#grest')||$('#gans'); if(t) t.focus(); }
function gAskHtml(extra){
  const c=game.cur;
  if(c.state==='ask'){ const part=gPartial(), n=gWords().length;
    const add=part?`<div class="row"><button class="btn ghost small" id="gaddword" type="button">+ Add a word</button><span class="hint">${c.shown} of ${n} words${thinking()?'. Finish the question in your head, then answer it.':' · <kbd>Space</kbd> in an empty box adds a word'}</span></div>`:'';
    return thinking()
    ? `${add}<div class="row"><button class="btn" id="greveal">Show answer</button>${extra||''}<span class="hint"><kbd>Enter</kbd> shows the answer</span></div>`
    : `${add}<form id="gform" autocomplete="off" style="display:grid;gap:10px">
        ${part?`<label style="display:grid;gap:4px"><span class="label">Finish the question</span><input type="text" id="grest" placeholder="Type the rest of the question" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(c.dq||'')}"></label>`:''}
        <label style="display:grid;gap:4px">${part?'<span class="label">Answer</span>':''}<div class="ansrow"><input type="text" id="gans" placeholder="Type your answer" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(c.da||'')}"><button class="btn" type="submit">Check</button></div></label>
      </form>${extra?`<div class="row">${extra}</div>`:''}`; }
  const q=Q[c.id], answers=q.a.map(a=>`<span class="ans">${fmtQ(a)}</span>`).join(' <span class="hint">or</span> ');
  if(thinking()&&!c.marked) return `<div class="fb" style="background:var(--sunk)">${c.part?`<div class="hint">You jumped after ${c.words} word${c.words===1?'':'s'}. The whole question: ${fmtQ(Q[c.id].q)}?</div>`:''}${answers}</div>
    <div class="row"><button class="btn" id="gright" style="background:var(--good);color:#fff">I got it</button><button class="btn" id="gwrong" style="background:var(--bad);color:#fff">I missed it</button><span class="hint"><kbd>Y</kbd> / <kbd>N</kbd></span></div>`;
  const qline=c.part?`<div class="qres ${c.qok===false?'bad':'good'}">Question ${c.qok===false?'✗':'✓'} <span class="hint">· jumped after ${c.words} word${c.words===1?'':'s'}</span>${c.qok===false&&c.rest?`<div class="yours">You finished it: <s>${esc(c.wordsText+' '+c.rest)}</s></div>`:''}</div>`:'';
  return `<div class="fb ${c.ok?'good':'bad'}">${c.msg?`<div class="hype">${esc(c.msg)}</div>`:''}${qline}<div>${answers}</div>${!c.ok&&c.typed&&c.aok===false?`<div class="yours">You typed: <s>${esc(c.typed)}</s></div>`:''}</div>`;
}
function gSubmit(typed,rest){ const c=game.cur; if(c.state!=='ask') return; typed=(typed||'').trim(); rest=(rest||'').trim();
  const part=gPartial(), w=gWords().slice(0,c.shown);
  const aok=!!typed&&grade(Q[c.id],typed)!=='wrong', qok=part?(!!rest&&gradeQuestion(Q[c.id].q,w,rest)!=='wrong'):true;
  Object.assign(c,{part,words:c.shown,wordsText:w.join(' '),rest,aok,qok}); gFinish(aok&&qok,typed); }
function gReveal(){ const c=game&&game.cur; if(!c||c.state!=='ask') return; c.part=gPartial(); c.words=c.shown; c.state='fb'; c.marked=false; render(); }
function gMark(ok){ const c=game&&game.cur; if(!c||c.state!=='fb'||c.marked) return; gFinish(ok,''); }
function gFinish(ok,typed){
  const c=game.cur; c.state='fb'; c.marked=true; c.ok=ok; c.typed=typed;
  game.streak=ok?(game.streak||0)+1:0; record(c.id,ok,{streak:game.streak,words:(ok&&c.part)?c.words:null}); save();
  game.res=game.res||[]; game.res.push({id:c.id,ok});
  if(game.type==='speed'){ ok?game.score++:game.missed.push(c.id); c.msg=''; render(); sfx(ok?'ding':'buzz'); if(!ok) oops(); checkDailyGoal(); checkBadges({at:true});
    clearTimeout(game.adv); game.adv=setTimeout(()=>{ if(game&&game.type==='speed'&&!game.done) speedNext(); }, ok?450:1400); return; }
  if(game.type==='boss'){ if(ok){ game.hp=Math.max(0,game.hp-1); c.msg=game.hp===0?'Final blow! The boss is going down!':pick(['Direct hit!','Critical hit!','Boom! Right in the scroll!','The boss staggers!','Massive damage!','Super effective!'],'boss'); }
    else { game.hearts--; c.msg=game.hearts===0?'Oh no, out of hearts!':pick(['Ouch! The boss hits back.','You lost a heart. Shake it off!','The boss dodged that one.','Careful, champ!'],'bossx'); } }
  if(game.type==='daily'){ c.msg=ok?rightMsg(game.streak,false):wrongMsg(); }
  render(); react(ok,game.streak);
}
function gNext(){
  if(!game) return;
  if(game.type==='boss'){ if(game.hp<=0) return bossEnd(true); if(game.hearts<=0) return bossEnd(false); game.qi=(game.qi+1)%game.ids.length; gNewQ(game.ids[game.qi]); render(); return; }
  if(game.type==='daily'){ game.qi++; if(game.qi>=game.ids.length) return dailyEnd(); gNewQ(game.ids[game.qi]); render(); return; }
}

/* Speed Round */
function speedStart(){ const ids=shuffle(gPool().slice()); game={type:'speed',ids,qi:0,score:0,missed:[],end:Date.now()+60000,streak:0,res:[],started:true,typed:U.opts.answer!=='think'}; gNewQ(ids[0]); sfx('buzzer'); render(); }
function speedNext(){ if(!game||game.done) return; game.qi=(game.qi+1)%game.ids.length; gNewQ(game.ids[game.qi]); render(); }
function speedEnd(){ if(!game||game.done) return; clearTimeout(game.adv); game.done=true; U.hs=U.hs||{}; const prev=U.hs.speed||0; game.prev=prev;
  if(game.score>prev){ U.hs.speed=game.score; game.newBest=prev>0||game.score>0; gainXP(20); }
  if(game.typed&&game.score>(U.hs.speedTyped||0)){ U.hs.speedTyped=game.score; game.newTypedBest=true; }
  U.sessions.unshift({d:Date.now(),label:'Speed Round',n:game.res.length,r:game.score}); U.sessions=U.sessions.slice(0,40); save(); render();
  if(game.newBest&&game.score>0){ sfx('cheer'); celebrate(true); } else sfx('buzzer'); checkBadges({perfect:false}); }

/* Boss Battle */
function bossStart(c){ const ids=shuffle(Q.filter(q=>q.c===c).map(q=>q.id)); game={type:'boss',c,ids,qi:0,hp:BOSS_HP,hearts:HEARTS,streak:0,res:[]}; gNewQ(ids[0]); sfx('boom'); render(); }
function bossEnd(win){ game.done=true; game.win=win; if(win){ U.bosses=U.bosses||{}; const first=!U.bosses[game.c]; U.bosses[game.c]=Date.now(); gainXP(first?50:15); game.first=first; }
  U.sessions.unshift({d:Date.now(),label:'Boss: John '+game.c,n:game.res.length,r:game.res.filter(x=>x.ok).length}); U.sessions=U.sessions.slice(0,40); save(); render();
  if(win){ sfx('cheer'); celebrate(true); } else { sfx('boom'); oops(); } checkBadges(); }

/* Daily Challenge */
function dailyStart(){ const day=dayKey(), ids=dailyIds(day); if(!ids.length){ toast('<b>No memory verses yet</b><span>Mark verses memorized on the Memory tab, and your Daily Challenge will quiz you on them.</span>'); return; }
  game={type:'daily',day,ids,n:ids.length,qi:0,streak:0,res:[],replay:!!(U.daily&&U.daily[day])}; gNewQ(game.ids[0]); render(); }
function dailyEnd(){ game.done=true; const sc=game.res.filter(x=>x.ok).length; U.daily=U.daily||{};
  const n=game.n, perfect=sc===n&&n>=5;
  if(!U.daily[game.day]){ U.daily[game.day]={s:sc,n,at:Date.now()}; gainXP(20+(perfect?30:0)); }
  const keys=Object.keys(U.daily).sort(); if(keys.length>60) keys.slice(0,keys.length-60).forEach(k=>delete U.daily[k]);
  U.sessions.unshift({d:Date.now(),label:'Daily Challenge',n:game.res.length,r:sc}); U.sessions=U.sessions.slice(0,40); save(); render();
  if(sc>=Math.ceil(n*.8)){ sfx('cheer'); celebrate(true); } checkBadges({perfect:perfect&&n>=10}); }

/* Buzzer Duel */
function duelStart(){ const ids=shuffle(gPool().slice()); game={type:'duel',ids,qi:0,p:[{name:duelNames[0]||'Player 1',score:0},{name:duelNames[1]||'Player 2',score:0}],target:duelTarget,phase:'ready',shown:0,buzz:null,stealer:null}; render(); }
function duelWords(){ return Q[game.ids[game.qi]].q.split(/\s+/).filter(Boolean); }
function duelRead(){ if(game.phase!=='ready') return; game.phase='reading'; game.fullAt=null; game.shown=1; game.nextWord=Date.now()+650;
  if(canSpeak){ const q=Q[game.ids[game.qi]], g=game, token=(g.readToken=(g.readToken||0)+1);
    game.voice=true; game.fallbackAt=Date.now()+(duelWords().length*450+4000);
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(`According to ${q.c}, ${q.v}. ${q.q.replace(/[()]/g,'')}?`); u.lang='en-US'; u.rate=.95;
      u.onstart=()=>duckMusic(true); u.onerror=()=>duckMusic(false);
      u.onend=()=>{ duckMusic(false); if(game===g&&g.readToken===token&&g.phase==='reading'&&!g.fullAt) g.fullAt=Date.now(); };
      speechSynthesis.speak(u); }catch(e){ game.voice=false; } }
  else game.voice=false;
  render(); }
function stopVoice(){ try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){} }
function duelBuzz(i){ if(!game||game.type!=='duel'||game.phase!=='reading') return; stopVoice(); game.phase='buzzed'; game.buzz=i; sfx('buzzer'); render(); }
function duelJudge(ok){ const g=game; if(g.phase==='judge'){ if(ok){ g.p[g.buzz].score++; sfx('ding'); celebrate(false); return duelAfter(); }
    sfx('buzz'); g.phase='steal'; g.stealer=1-g.buzz; render(); return; }
  if(g.phase==='stealjudge'){ if(ok){ g.p[g.stealer].score++; sfx('ding'); celebrate(false);} else sfx('buzz'); return duelAfter(); } }
function duelAfter(){ const g=game; const w=g.p.findIndex(p=>p.score>=g.target); if(w>=0){ g.phase='done'; g.winner=w; U.counts=U.counts||{}; U.counts.duels=(U.counts.duels||0)+1; save(); render(); sfx('cheer'); celebrate(true); checkBadges(); return; }
  g.phase='between'; render(); }
function duelNext(){ const g=game; g.qi=(g.qi+1)%g.ids.length; g.phase='ready'; g.shown=0; g.buzz=null; g.stealer=null; render(); }

/* one ticker for all game clocks */
setInterval(()=>{
  if(tab!=='games'||!game||game.done) return;
  if(game.type==='speed'&&game.started){ const left=game.end-Date.now(), el=document.getElementById('gtime'), bar=document.getElementById('gbar');
    if(el) el.textContent=Math.max(0,Math.ceil(left/1000)); if(bar) bar.style.width=Math.max(0,left/600)+'%';
    const box=document.getElementById('gclock'); if(box) box.classList.toggle('warn',left<=10000);
    const s=Math.ceil(left/1000); if(left<=5000&&left>0&&game.lastTick!==s){game.lastTick=s;sfx('tick')}
    if(left<=0) speedEnd(); }
  if(game.type==='duel'&&game.phase==='reading'&&game.voice){ const now=Date.now();
    if(!game.fullAt&&now>=game.fallbackAt) game.fullAt=now;
    if(game.fullAt){ const left=6000-(now-game.fullAt), el=document.getElementById('dwait'); if(el) el.textContent=left>0?`Buzz in! ${Math.ceil(left/1000)}…`:'';
      if(left<=0){ game.phase='nobody'; sfx('buzz'); render(); } } }
  else if(game.type==='duel'&&game.phase==='reading'){ const words=duelWords(), now=Date.now();
    if(game.shown<words.length&&now>=game.nextWord){ game.shown++; game.nextWord=now+650; const el=document.getElementById('dq'); if(el) el.innerHTML=esc(words.slice(0,game.shown).join(' '))+(game.shown<words.length?' <span class="more">…</span>':'?'); }
    if(game.shown>=words.length){ if(!game.fullAt) game.fullAt=now; const left=6000-(now-game.fullAt), el=document.getElementById('dwait'); if(el) el.textContent=left>0?`Buzz in! ${Math.ceil(left/1000)}…`:'';
      if(left<=0){ game.phase='nobody'; sfx('buzz'); render(); } } }
},100);

function dailyView(){

    if(errs.length||!out.size){goalMsg=`Couldn't read “${errs[0]||$('#goalrange').value}”. Try 3, 3:1-21, or 2:13-3:8.`;renderKeep();return}
    out.forEach(k=>goalDraft.add(k)); goalMsg=''; renderKeep()};
  on('#goalall',()=>{goalMsg='';VERSES_IN_JOHN.forEach((n,i)=>{for(let v=1;v<=n;v++)goalDraft.add((i+1)+':'+v)});renderKeep()});
  on('#goalclear',()=>{goalMsg='';goalDraft=new Set();renderKeep()});
  on('#goalcancel',()=>{goalEdit=false;goalMsg='';renderKeep()});
  on('#goalsave',()=>{if(!goalDraft.size)return;U.goal=rangeLabel([...goalDraft],allVerses);goalEdit=false;goalMsg='';save();checkBadges();renderKeep()});
  on('#goaledit',()=>{goalEdit=true;goalDraft=new Set(goalKeys(U)||[]);renderKeep()});
  on('#memscope',()=>{showAllMem=!showAllMem;renderKeep()});
}
function refreshMemHead(){const y=scrollY;render();scrollTo(0,y)}

// Enter on feedback advances even if focus left the input
document.addEventListener('keydown',e=>{
  const ae=document.activeElement, typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  if(tab==='games'&&game&&!typing&&!e.metaKey&&!e.ctrlKey){
    if(game.type==='duel'&&game.phase==='reading'){ if(e.key==='a'||e.key==='A'){e.preventDefault();duelBuzz(0);return} if(e.key==='l'||e.key==='L'){e.preventDefault();duelBuzz(1);return} }
    if(game.cur&&!game.done&&thinking()){ if(game.cur.state==='ask'&&e.key===' '&&gPartial()){e.preventDefault();gAddWord();return} if(game.cur.state==='ask'&&e.key==='Enter'){e.preventDefault();gReveal();return}
      if(game.cur.state==='fb'&&!game.cur.marked){ if(/^[yY]$/.test(e.key)){e.preventDefault();gMark(true);return} if(/^[nN]$/.test(e.key)){e.preventDefault();gMark(false);return} } }
  }
  if(tab==='practice' && quiz && !quiz.done && U && U.opts.answer==='think' && !typing && !e.metaKey && !e.ctrlKey){
    if(quiz.state==='ask'){ if(e.key==='Enter'){e.preventDefault();thinkReveal()} else if(e.key===' '&&partial()){e.preventDefault();addWord()} }
    else if(!quiz.last.marked){ if(/^[yY]$/.test(e.key)){e.preventDefault();thinkMark(true)} else if(/^[nN]$/.test(e.key)){e.preventDefault();thinkMark(false)} }
    else if(e.key==='Enter'){e.preventDefault();nextQ()}
    return;
  }
  if(tab==='verses' && vc && !vc.done && !typing && !e.metaKey && !e.ctrlKey){
    if(vc.state==='ask' && vc.mode==='think' && e.key==='Enter'){e.preventDefault();vReveal();return}
    if(vc.state==='fb' && vc.mode==='think' && !vc.last.marked){ if(/^[yY]$/.test(e.key)){e.preventDefault();vMark(true)} else if(/^[nN]$/.test(e.key)){e.preventDefault();vMark(false)} return }
    if(vc.state==='fb' && (vc.mode==='type'||vc.last.marked) && e.key==='Enter' && ae.tagName!=='BUTTON'){e.preventDefault();vNext();return}
  }
  if(e.key==='Enter' && quiz && !quiz.done && quiz.state==='fb' && tab==='practice' && ae && ae.id!=='ans' && ae.tagName!=='BUTTON'){e.preventDefault();nextQ()} });

render();
cloud.status='off';
})();
</script>
