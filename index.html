<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Bible quiz practice for the Gospel of John: questions, verse cards, games and memory tracking.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="John Quiz">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>John Quiz Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&family=Jersey+15&family=VT323&display=swap">
<style>
/* Layout: one focused study column under a frosted top bar; the question card is the stage, everything else stays quiet. Quiz-show energy: buzzer violet, hot-pink sparks, chunky display type. */
:root{
  --bg:#F3F2FB; --bg2:#E9E6FA; --surface:#FFFFFF; --sunk:#ECEAF7; --line:#DCD8EE;
  --ink:#16132B; --muted:#625D80; --accent:#5B3DF5; --accent2:#E93D8F; --accent-ink:#FFFFFF; --accent-soft:#E6E0FF;
  --good:#0E9F6E; --good-soft:#D5F5E8; --bad:#E0364A; --bad-soft:#FDE0E4; --warn:#B36B00; --warn-soft:#FFF0D3;
  --gold:#D99A00; --gold-soft:#FFF1C7; --shadow:0 18px 40px -22px rgba(40,22,120,.35);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-text:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0B1C; --bg2:#151230; --surface:#1A1734; --sunk:#221E42; --line:#2F2A57;
  --ink:#F1EFFF; --muted:#A39FC6; --accent:#8B73FF; --accent2:#FF5FA8; --accent-ink:#0D0B1C; --accent-soft:#2C2560;
  --good:#3FE0A0; --good-soft:#123A2E; --bad:#FF6B7D; --bad-soft:#44182A; --warn:#FFC155; --warn-soft:#3B2E12;
  --gold:#FFCB45; --gold-soft:#3A3014; --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D0B1C; --bg2:#151230; --surface:#1A1734; --sunk:#221E42; --line:#2F2A57;
  --ink:#F1EFFF; --muted:#A39FC6; --accent:#8B73FF; --accent2:#FF5FA8; --accent-ink:#0D0B1C; --accent-soft:#2C2560;
  --good:#3FE0A0; --good-soft:#123A2E; --bad:#FF6B7D; --bad-soft:#44182A; --warn:#FFC155; --warn-soft:#3B2E12;
  --gold:#FFCB45; --gold-soft:#3A3014; --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(900px 500px at 85% -10%,var(--accent-soft),transparent 60%),radial-gradient(700px 400px at -10% 110%,var(--bg2),transparent 60%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:-.02em}
h2{font-weight:700!important;font-size:clamp(22px,5vw,30px)!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.label{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 25%,transparent),0 0 16px var(--accent2)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tabs button:hover{color:var(--ink)}
@media (max-width:560px){.tabs{width:100%;gap:0}.tabs button{flex:1 1 auto;padding:7px 5px;font-size:12px;letter-spacing:-.01em}}
@media (max-width:420px){.tabs button{font-size:11.5px;padding:7px 3px}}
@media (max-width:370px){.tabs button{font-size:10.5px;padding:7px 2px}}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--accent)}
.who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);font-weight:600}

/* buttons */
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:12px 20px;border-radius:12px;letter-spacing:.01em;box-shadow:0 10px 22px -12px var(--accent);transition:transform .12s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:7px 13px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
section{display:grid;gap:16px;padding-block:26px 0;animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 15px;font-size:17px;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
textarea{font-family:var(--f-mono);font-size:12px;min-height:80px;color:var(--ink)}

/* sign in */
.signin{max-width:460px;margin:9vh auto 0;display:grid;gap:20px}
.signin h1{font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-.04em}
.signin h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names button{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;font-weight:700;transition:transform .12s,border-color .15s}
.names button:hover{border-color:var(--accent);transform:translateY(-1px)}

/* chapter + verse pickers */
.chgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
@media (max-width:480px){.chgrid{grid-template-columns:repeat(5,1fr)}}
.ch{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 6px;display:grid;justify-items:center;gap:1px;transition:transform .12s,border-color .15s,background .15s}
.ch:hover{transform:translateY(-1px);border-color:var(--accent)}
.ch b{font-family:var(--f-display);font-size:16px;font-weight:700}
.ch small{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.ch.all{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch.all small{color:var(--accent-ink);opacity:.8}
.ch.some{border-color:var(--accent);background:var(--accent-soft)}
.ch.open{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent2)}
.vpanel{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.vgrid{display:flex;flex-wrap:wrap;gap:5px}
.v,.mv{min-width:38px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 0;font-family:var(--f-mono);font-size:13px;position:relative;transition:transform .1s,background .15s}
.v:active,.mv:active{transform:scale(.92)}
.v.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.v.mem::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.mv.on{background:var(--gold-soft);border-color:var(--gold);font-weight:700}
.mv.out{opacity:.35}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.opt{display:grid;gap:7px;align-content:start}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1.5px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:all .15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.startbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 18px;box-shadow:var(--shadow);z-index:3}
.count{font-size:14px;color:var(--muted)}
.count b{font-family:var(--f-display);font-size:24px;color:var(--ink);margin-right:4px}

/* quiz stage */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ref{font-family:var(--f-mono);font-weight:700;background:var(--ink);color:var(--bg);padding:5px 11px;border-radius:8px;font-size:13.5px;letter-spacing:.02em}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4.5vw,34px);display:grid;gap:18px;box-shadow:var(--shadow);position:relative;transition:box-shadow .3s,border-color .3s}
.qcard.is-right{border-color:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 22%,transparent),var(--shadow)}
.qcard.is-wrong{border-color:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 22%,transparent),var(--shadow);animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.qtext{font-family:var(--f-text);font-size:clamp(22px,4.8vw,31px);line-height:1.28;font-weight:800;letter-spacing:-.015em;text-wrap:pretty}
.qtext .qref{color:var(--accent);font-weight:800;white-space:nowrap}
.qtext .opt-words,.qtext .more{color:var(--muted);font-weight:500}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1;min-width:0;font-size:19px}
.fb{border-radius:16px;padding:16px 18px;display:grid;gap:8px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.close{background:var(--warn-soft)}
.fb h3{font-size:19px;font-weight:700}
.fb.good h3{color:var(--good)} .fb.bad h3{color:var(--bad)} .fb.close h3{color:var(--warn)}
.fb .hype{font-family:var(--f-display);font-size:clamp(17px,4vw,21px);line-height:1.2;font-weight:700;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.fb.good .hype{color:var(--good)} .fb.bad .hype{color:var(--bad)} .fb.close .hype{color:var(--warn)}
@keyframes pop{from{transform:scale(.6) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.fb .ans{font-family:var(--f-text);font-size:18px;font-weight:600}
.fb .yours{font-size:14px;color:var(--muted)}
.fb .yours s{color:var(--bad)}
.qres{font-weight:800;font-size:14px}
.qres.good{color:var(--good)} .qres.bad{color:var(--bad)}
.wmiss{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
.wextra{color:var(--muted)}
.tally{display:flex;gap:12px;font-family:var(--f-mono);font-size:13.5px;align-items:center}
.tally .g{color:var(--good)} .tally .b{color:var(--bad)}
.nextbtn{width:100%;padding:16px 20px;font-size:17px;border-radius:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;animation:pop .35s .15s both}
.daypill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:13px;font-weight:700;padding:3px 4px 3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.daypill i{font-style:normal}
.daypill .daytoday{font-family:var(--f-mono);font-size:10.5px;font-weight:700;background:var(--sunk);color:var(--muted);padding:1px 6px;border-radius:99px;margin-left:2px}
.daypill.done{border-color:var(--accent2)}
.daypill.done .daytoday{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.streakpanel{display:grid;grid-template-columns:auto 1fr;gap:16px 28px;align-items:center}
@media (max-width:520px){.streakpanel{grid-template-columns:1fr}}
.bigstreak{font-family:var(--f-display);font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.05;display:flex;align-items:baseline;gap:6px}
.bigstreak small{font-size:16px;color:var(--muted);font-weight:700;letter-spacing:0}
.days14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days14 i{aspect-ratio:1;max-width:100%;border-radius:5px;background:var(--sunk)}
.days14 i.some{background:var(--accent-soft)}
.days14 i.hit{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.days14 i.today{outline:2px solid var(--ink);outline-offset:1px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;display:grid;gap:2px;text-align:center;box-shadow:var(--shadow);animation:pop .4s both;max-width:calc(100vw - 32px)}
.toast b{font-family:var(--f-display);font-size:17px}
.toast span{font-size:13.5px;opacity:.85}
.saybtn{padding:5px 11px}
.homecard{display:grid;gap:8px;padding:16px}
.howto{display:grid;gap:6px;font-size:14px}
.howto .pill{margin-right:4px}
.timer{display:flex;align-items:center;gap:10px}
.timer .tbar{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.timer .tbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .1s linear}
.timer span{font-weight:700;font-size:15px;min-width:24px;text-align:right}
.timer.warn .tbar i{background:var(--bad)}
.timer.warn span{color:var(--bad);animation:pop .4s infinite alternate}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:2px;justify-items:start;background:var(--sunk);opacity:.55}
.badge .bi{font-size:24px;line-height:1.2}
.badge b{font-size:13px}
.badge small{font-size:11.5px;color:var(--muted);line-height:1.3}
.badge.on{opacity:1;background:var(--surface);border-color:var(--accent);box-shadow:0 6px 18px -12px var(--accent)}
.lvlchip{font-family:var(--f-display);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.sndbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;width:30px;height:30px;padding:0;font-size:14px}
.lvlpanel{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lvlbig{font-family:var(--f-display);font-size:50px;font-weight:800;line-height:1;width:84px;height:84px;border-radius:24px;display:grid;place-items:center;align-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.lvlbig small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.days14 i.frz{background:#7cc4ff}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.themebtn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;display:grid;gap:4px;justify-items:start;text-align:left}
.themebtn .sw{width:100%;height:28px;border-radius:9px}
.themebtn small{font-size:11.5px;color:var(--muted)}
.themebtn.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.themebtn:disabled{opacity:.55;cursor:not-allowed}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gamecard{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:18px;display:grid;gap:6px;justify-items:start;text-align:left;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.gamecard:hover{transform:translateY(-3px);border-color:var(--accent)}
.gamecard .gi{font-size:34px;line-height:1}
.gamecard b{font-family:var(--f-display);font-size:18px}
.gamecard small{color:var(--muted);font-size:13.5px}
.gclock{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display);font-weight:800}
.gclock span{font-size:40px;line-height:1}
.gclock small{color:var(--muted);font-size:13px}
.gclock.warn span{color:var(--bad);animation:pop .5s infinite alternate}
.bossgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.bosscard{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 8px;display:grid;gap:2px;justify-items:center;text-align:center;transition:transform .15s}
.bosscard:hover{transform:translateY(-2px);border-color:var(--bad)}
.bosscard .bi{font-size:30px}
.bosscard small{font-size:11px;color:var(--muted);line-height:1.25}
.bosscard.won{border-color:var(--gold);background:var(--gold-soft)}
.bosscard .trophy{position:absolute;top:4px;right:6px;font-size:15px}
.bossarena{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bossbig{font-size:64px;line-height:1;display:inline-block;transition:transform .2s}
.bossbig.hit{animation:shake .45s}
.bossbig.dead{filter:grayscale(1);transform:rotate(90deg);opacity:.6}
.hpbar{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--warn));transition:width .4s}
.hearts{font-size:22px;display:flex;gap:2px}
.hearts .lost{filter:grayscale(1);opacity:.3}
.dailyhist{display:flex;gap:8px;flex-wrap:wrap}
.dailyhist div{display:grid;justify-items:center;padding:6px 10px;border-radius:12px;background:var(--sunk)}
.dailyhist b{font-family:var(--f-display);font-size:20px}
.dailyhist small{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.duel{gap:12px}
.duelpad{display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:var(--surface);border:2px solid var(--line)}
.duelpad.p1{transform:rotate(180deg)}
.duelpad.lit{border-color:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 30%,transparent)}

/* Retro game skin. Every color comes from a variable so each unlockable theme can repaint the whole site.

:root:root:root:root{
  --bg:#fcd8a8; --dot:#e2b47c; --ink:#2b1a00; --muted:#6b4410; --label:#005800; --title-shadow:#fff2d8;
  --hud:#000; --hud-line:#c84c0c;

  --win-ink:#ffffff; --win-muted:#fcd8a8; --win-label:#fcb800; --win-line:#7c4a1a;
  --accent:#00a800; --accent-hover:#18c018; --accent-text:#ffffff; --accent-shadow:#004000;
  --accent2:#d82800; --gold:#fcb800; --good:#80d010; --bad:#ff5a3c; --warn:#fca044;
  --bar1:#80d010; --bar2:#00a800; --hp1:#d82800; --hp2:#8c1800;
  --surface:var(--win); --sunk:var(--tile); --line:var(--win-line); --accent-ink:var(--accent-text);

  --good-soft:color-mix(in srgb,var(--good) 20%,var(--tile)); --bad-soft:color-mix(in srgb,var(--bad) 22%,var(--tile));
  --warn-soft:color-mix(in srgb,var(--warn) 22%,var(--tile)); --gold-soft:color-mix(in srgb,var(--gold) 20%,var(--tile));

}
.bar,.panel,.qcard,.stat,.gamecard,.notice,.homecard,.songcard,.duelmid,.duelpad,.bossarena,.startbar,.badge,.themebtn,.bosscard,.toast{

.bar{--win:var(--hud)}
body{background-color:var(--bg)!important;

.seg button,.names button{background:var(--tile);border-color:var(--win-line);color:var(--win-muted)}

.prog,.goldbar,.meter,.hpbar,.timer .tbar{background:#000!important;border-color:var(--frame)}
.prog i,.timer .tbar i{background:repeating-linear-gradient(90deg,var(--bar1) 0 10px,var(--bar2) 10px 12px)!important}

.hpbar i,.timer.warn .tbar i{background:repeating-linear-gradient(90deg,var(--hp1) 0 10px,var(--hp2) 10px 12px)!important}

.days14 i.hit{background:var(--good)}
.days14 i.some{background:var(--win-line)}

.buzz{background:var(--accent2)!important}
.duelpad.p0 .buzz{background:var(--accent)!important}
.listen i{background:var(--good)}
.badge{background:var(--tile);border-color:var(--win-line)}

.signin h1{color:var(--ink);text-shadow:3px 3px 0 var(--title-shadow)}

.themebtn.cur{border-color:var(--gold)!important}

<script type="application/json" id="esvdata">{"1":{"1":"In the beginning was the Word, and the Word was with God, and the Word was God.","2":"He was in the beginning with God.","3":"All things were made through him, and without him was not any thing made that was made.","4":"In him was life, and the life was the light of men.","5":"The light shines in the darkness, and the darkness has not overcome it.","6":"There was a man sent from God, whose name was John.","7":"He came as a witness, to bear witness about the light, that all might believe through him.","8":"He was not the light, but came to bear witness about the light.","9":"The true light, which gives light to everyone, was coming into the world.","10":"He was in the world, and the world was made through him, yet the world did not know him.","11":"He came to his own, and his own people did not receive him.","12":"But to all who did receive him, who believed in his name, he gave the right to become children of God,","13":"who were born, not of blood nor of the will of the flesh nor of the will of man, but of God.","14":"And the Word became flesh and dwelt among us, and we have seen his glory, glory as of the only Son from the Father, full of grace and truth.","15":"(John bore witness about him, and cried out, “This was he of whom I said, ‘He who comes after me ranks before me, because he was before me.’”)","16":"For from his fullness we have all received, grace upon grace.","17":"For the law was given through Moses; grace and truth came through Jesus Christ.","18":"No one has ever seen God; God the only Son, who is at the Father’s side, he has made him known.","19":"And this is the testimony of John, when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”","20":"He confessed, and did not deny, but confessed, “I am not the Christ.”","21":"And they asked him, “What then? Are you Elijah?” He said, “I am not.” “Are you the Prophet?” And he answered, “No.”","22":"So they said to him, “Who are you? We need to give an answer to those who sent us. What do you say about yourself?”","23":"He said, “I am the voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ as the prophet Isaiah said.”","24":"(Now they had been sent from the Pharisees.)","25":"They asked him, “Then why are you baptizing, if you are neither the Christ, nor Elijah, nor the Prophet?”","26":"John answered them, “I baptize with water, but among you stands one you do not know,","27":"even he who comes after me, the strap of whose sandal I am not worthy to untie.”","28":"These things took place in Bethany across the Jordan, where John was baptizing.","29":"The next day he saw Jesus coming toward him, and said, “Behold, the Lamb of God, who takes away the sin of the world!","30":"This is he of whom I said, ‘After me comes a man who ranks before me, because he was before me.’","31":"I myself did not know him, but for this purpose I came baptizing with water, that he might be revealed to Israel.”","32":"And John bore witness: “I saw the Spirit descend from heaven like a dove, and it remained on him.","33":"I myself did not know him, but he who sent me to baptize with water said to me, ‘He on whom you see the Spirit descend and remain, this is he who baptizes with the Holy Spirit.’","34":"And I have seen and have borne witness that this is the Son of God.”","35":"The next day again John was standing with two of his disciples,","36":"and he looked at Jesus as he walked by and said, “Behold, the Lamb of God!”","37":"The two disciples heard him say this, and they followed Jesus.","38":"Jesus turned and saw them following and said to them, “What are you seeking?” And they said to him, “Rabbi” (which means Teacher), “where are you staying?”","39":"He said to them, “Come and you will see.” So they came and saw where he was staying, and they stayed with him that day, for it was about the tenth hour.","40":"One of the two who heard John speak and followed Jesus was Andrew, Simon Peter’s brother.","41":"He first found his own brother Simon and said to him, “We have found the Messiah” (which means Christ).","42":"He brought him to Jesus. Jesus looked at him and said, “You are Simon the son of John. You shall be called Cephas” (which means Peter).","43":"The next day Jesus decided to go to Galilee. He found Philip and said to him, “Follow me.”","44":"Now Philip was from Bethsaida, the city of Andrew and Peter.","45":"Philip found Nathanael and said to him, “We have found him of whom Moses in the Law and also the prophets wrote, Jesus of Nazareth, the son of Joseph.”","46":"Nathanael said to him, “Can anything good come out of Nazareth?” Philip said to him, “Come and see.”","47":"Jesus saw Nathanael coming toward him and said of him, “Behold, an Israelite indeed, in whom there is no deceit!”","48":"Nathanael said to him, “How do you know me?” Jesus answered him, “Before Philip called you, when you were under the fig tree, I saw you.”","49":"Nathanael answered him, “Rabbi, you are the Son of God! You are the King of Israel!”","50":"Jesus answered him, “Because I said to you, ‘I saw you under the fig tree,’ do you believe? You will see greater things than these.”","51":"And he said to him, “Truly, truly, I say to you, you will see heaven opened, and the angels of God ascending and descending on the Son of Man.”"},"2":{"1":"On the third day there was a wedding at Cana in Galilee, and the mother of Jesus was there.","2":"Jesus also was invited to the wedding with his disciples.","3":"When the wine ran out, the mother of Jesus said to him, “They have no wine.”","4":"And Jesus said to her, “Woman, what does this have to do with me? My hour has not yet come.”","5":"His mother said to the servants, “Do whatever he tells you.”","6":"Now there were six stone water jars there for the Jewish rites of purification, each holding twenty or thirty gallons.","7":"Jesus said to the servants, “Fill the jars with water.” And they filled them up to the brim.","8":"And he said to them, “Now draw some out and take it to the master of the feast.” So they took it.","9":"When the master of the feast tasted the water now become wine, and did not know where it came from (though the servants who had drawn the water knew), the master of the feast called the bridegroom","10":"and said to him, “Everyone serves the good wine first, and when people have drunk freely, then the poor wine. But you have kept the good wine until now.”","11":"This, the first of his signs, Jesus did at Cana in Galilee, and manifested his glory. And his disciples believed in him.","12":"After this he went down to Capernaum, with his mother and his brothers and his disciples, and they stayed there for a few days.","13":"The Passover of the Jews was at hand, and Jesus went up to Jerusalem.","14":"In the temple he found those who were selling oxen and sheep and pigeons, and the money-changers sitting there.","15":"And making a whip of cords, he drove them all out of the temple, with the sheep and oxen. And he poured out the coins of the money-changers and overturned their tables.","16":"And he told those who sold the pigeons, “Take these things away; do not make my Father’s house a house of trade.”","17":"His disciples remembered that it was written, “Zeal for your house will consume me.”","18":"So the Jews said to him, “What sign do you show us for doing these things?”","19":"Jesus answered them, “Destroy this temple, and in three days I will raise it up.”","20":"The Jews then said, “It has taken forty-six years to build this temple, and will you raise it up in three days?”","21":"But he was speaking about the temple of his body.","22":"When therefore he was raised from the dead, his disciples remembered that he had said this, and they believed the Scripture and the word that Jesus had spoken.","23":"Now when he was in Jerusalem at the Passover Feast, many believed in his name when they saw the signs that he was doing.","24":"But Jesus on his part did not entrust himself to them, because he knew all people","25":"and needed no one to bear witness about man, for he himself knew what was in man."},"3":{"1":"Now there was a man of the Pharisees named Nicodemus, a ruler of the Jews.","2":"This man came to Jesus by night and said to him, “Rabbi, we know that you are a teacher come from God, for no one can do these signs that you do unless God is with him.”","3":"Jesus answered him, “Truly, truly, I say to you, unless one is born again he cannot see the kingdom of God.”","4":"Nicodemus said to him, “How can a man be born when he is old? Can he enter a second time into his mother’s womb and be born?”","5":"Jesus answered, “Truly, truly, I say to you, unless one is born of water and the Spirit, he cannot enter the kingdom of God.","6":"That which is born of the flesh is flesh, and that which is born of the Spirit is spirit.","7":"Do not marvel that I said to you, ‘You must be born again.’","8":"The wind blows where it wishes, and you hear its sound, but you do not know where it comes from or where it goes. So it is with everyone who is born of the Spirit.”","9":"Nicodemus said to him, “How can these things be?”","10":"Jesus answered him, “Are you the teacher of Israel and yet you do not understand these things?","11":"Truly, truly, I say to you, we speak of what we know, and bear witness to what we have seen, but you do not receive our testimony.","12":"If I have told you earthly things and you do not believe, how can you believe if I tell you heavenly things?","13":"No one has ascended into heaven except he who descended from heaven, the Son of Man.","14":"And as Moses lifted up the serpent in the wilderness, so must the Son of Man be lifted up,","15":"that whoever believes in him may have eternal life.","16":"“For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life.","17":"For God did not send his Son into the world to condemn the world, but in order that the world might be saved through him.","18":"Whoever believes in him is not condemned, but whoever does not believe is condemned already, because he has not believed in the name of the only Son of God.","19":"And this is the judgment: the light has come into the world, and people loved the darkness rather than the light because their works were evil.","20":"For everyone who does wicked things hates the light and does not come to the light, lest his works should be exposed.","21":"But whoever does what is true comes to the light, so that it may be clearly seen that his works have been carried out in God.”","22":"After this Jesus and his disciples went into the Judean countryside, and he remained there with them and was baptizing.","23":"John also was baptizing at Aenon near Salim, because water was plentiful there, and people were coming and being baptized","24":"(for John had not yet been put in prison).","25":"Now a discussion arose between some of John’s disciples and a Jew over purification.","26":"And they came to John and said to him, “Rabbi, he who was with you across the Jordan, to whom you bore witness—look, he is baptizing, and all are going to him.”","27":"John answered, “A person cannot receive even one thing unless it is given him from heaven.","28":"You yourselves bear me witness, that I said, ‘I am not the Christ, but I have been sent before him.’","29":"The one who has the bride is the bridegroom. The friend of the bridegroom, who stands and hears him, rejoices greatly at the bridegroom’s voice. Therefore this joy of mine is now complete.","30":"He must increase, but I must decrease.”","31":"He who comes from above is above all. He who is of the earth belongs to the earth and speaks in an earthly way. He who comes from heaven is above all.","32":"He bears witness to what he has seen and heard, yet no one receives his testimony.","33":"Whoever receives his testimony sets his seal to this, that God is true.","34":"For he whom God has sent utters the words of God, for he gives the Spirit without measure.","35":"The Father loves the Son and has given all things into his hand.","36":"Whoever believes in the Son has eternal life; whoever does not obey the Son shall not see life, but the wrath of God remains on him."},"4":{"1":"Now when Jesus learned that the Pharisees had heard that Jesus was making and baptizing more disciples than John","2":"(although Jesus himself did not baptize, but only his disciples),","3":"he left Judea and departed again for Galilee.","4":"And he had to pass through Samaria.","5":"So he came to a town of Samaria called Sychar, near the field that Jacob had given to his son Joseph.","6":"Jacob’s well was there; so Jesus, wearied as he was from his journey, was sitting beside the well. It was about the sixth hour.","7":"A woman from Samaria came to draw water. Jesus said to her, “Give me a drink.”","8":"(For his disciples had gone away into the city to buy food.)","9":"The Samaritan woman said to him, “How is it that you, a Jew, ask for a drink from me, a woman of Samaria?” (For Jews have no dealings with Samaritans.)","10":"Jesus answered her, “If you knew the gift of God, and who it is that is saying to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”","11":"The woman said to him, “Sir, you have nothing to draw water with, and the well is deep. Where do you get that living water?","12":"Are you greater than our father Jacob? He gave us the well and drank from it himself, as did his sons and his livestock.”","13":"Jesus said to her, “Everyone who drinks of this water will be thirsty again,","14":"but whoever drinks of the water that I will give him will never be thirsty again. The water that I will give him will become in him a spring of water welling up to eternal life.”","15":"The woman said to him, “Sir, give me this water, so that I will not be thirsty or have to come here to draw water.”","16":"Jesus said to her, “Go, call your husband, and come here.”","17":"The woman answered him, “I have no husband.” Jesus said to her, “You are right in saying, ‘I have no husband’;","18":"for you have had five husbands, and the one you now have is not your husband. What you have said is true.”","19":"The woman said to him, “Sir, I perceive that you are a prophet.","20":"Our fathers worshiped on this mountain, but you say that in Jerusalem is the place where people ought to worship.”","21":"Jesus said to her, “Woman, believe me, the hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.","22":"You worship what you do not know; we worship what we know, for salvation is from the Jews.","23":"But the hour is coming, and is now here, when the true worshipers will worship the Father in spirit and truth, for the Father is seeking such people to worship him.","24":"God is spirit, and those who worship him must worship in spirit and truth.”","25":"The woman said to him, “I know that Messiah is coming (he who is called Christ). When he comes, he will tell us all things.”","26":"Jesus said to her, “I who speak to you am he.”","27":"Just then his disciples came back. They marveled that he was talking with a woman, but no one said, “What do you seek?” or, “Why are you talking with her?”","28":"So the woman left her water jar and went away into town and said to the people,","29":"“Come, see a man who told me all that I ever did. Can this be the Christ?”","30":"They went out of the town and were coming to him.","31":"Meanwhile the disciples were urging him, saying, “Rabbi, eat.”","32":"But he said to them, “I have food to eat that you do not know about.”","33":"So the disciples said to one another, “Has anyone brought him something to eat?”","34":"Jesus said to them, “My food is to do the will of him who sent me and to accomplish his work.","35":"Do you not say, ‘There are yet four months, then comes the harvest’? Look, I tell you, lift up your eyes, and see that the fields are white for harvest.","36":"Already the one who reaps is receiving wages and gathering fruit for eternal life, so that sower and reaper may rejoice together.","37":"For here the saying holds true, ‘One sows and another reaps.’","38":"I sent you to reap that for which you did not labor. Others have labored, and you have entered into their labor.”","39":"Many Samaritans from that town believed in him because of the woman’s testimony, “He told me all that I ever did.”","40":"So when the Samaritans came to him, they asked him to stay with them, and he stayed there two days.","41":"And many more believed because of his word.","42":"They said to the woman, “It is no longer because of what you said that we believe, for we have heard for ourselves, and we know that this is indeed the Savior of the world.”","43":"After the two days he departed for Galilee.","44":"(For Jesus himself had testified that a prophet has no honor in his own hometown.)","45":"So when he came to Galilee, the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast. For they too had gone to the feast.","46":"So he came again to Cana in Galilee, where he had made the water wine. And at Capernaum there was an official whose son was ill.","47":"When this man heard that Jesus had come from Judea to Galilee, he went to him and asked him to come down and heal his son, for he was at the point of death.","48":"So Jesus said to him, “Unless you see signs and wonders you will not believe.”","49":"The official said to him, “Sir, come down before my child dies.”","50":"Jesus said to him, “Go; your son will live.” The man believed the word that Jesus spoke to him and went on his way.","51":"As he was going down, his servants met him and told him that his son was recovering.","52":"So he asked them the hour when he began to get better, and they said to him, “Yesterday at the seventh hour the fever left him.”","53":"The father knew that was the hour when Jesus had said to him, “Your son will live.” And he himself believed, and all his household.","54":"This was now the second sign that Jesus did when he had come from Judea to Galilee."},"5":{"1":"After this there was a feast of the Jews, and Jesus went up to Jerusalem.","2":"Now there is in Jerusalem by the Sheep Gate a pool, in Aramaic called Bethesda, which has five roofed colonnades.","3":"In these lay a multitude of invalids—blind, lame, and paralyzed.","5":"One man was there who had been an invalid for thirty-eight years.","6":"When Jesus saw him lying there and knew that he had already been there a long time, he said to him, “Do you want to be healed?”","7":"The sick man answered him, “Sir, I have no one to put me into the pool when the water is stirred up, and while I am going another steps down before me.”","8":"Jesus said to him, “Get up, take up your bed, and walk.”","9":"And at once the man was healed, and he took up his bed and walked. Now that day was the Sabbath.","10":"So the Jews said to the man who had been healed, “It is the Sabbath, and it is not lawful for you to take up your bed.”","11":"But he answered them, “The man who healed me, that man said to me, ‘Take up your bed, and walk.’”","12":"They asked him, “Who is the man who said to you, ‘Take up your bed and walk’?”","13":"Now the man who had been healed did not know who it was, for Jesus had withdrawn, as there was a crowd in the place.","14":"Afterward Jesus found him in the temple and said to him, “See, you are well! Sin no more, that nothing worse may happen to you.”","15":"The man went away and told the Jews that it was Jesus who had healed him.","16":"And this was why the Jews were persecuting Jesus, because he was doing these things on the Sabbath.","17":"But Jesus answered them, “My Father is working until now, and I am working.”","18":"This was why the Jews were seeking all the more to kill him, because not only was he breaking the Sabbath, but he was even calling God his own Father, making himself equal with God.","19":"So Jesus said to them, “Truly, truly, I say to you, the Son can do nothing of his own accord, but only what he sees the Father doing. For whatever the Father does, that the Son does likewise.","20":"For the Father loves the Son and shows him all that he himself is doing. And greater works than these will he show him, so that you may marvel.","21":"For as the Father raises the dead and gives them life, so also the Son gives life to whom he will.","22":"For the Father judges no one, but has given all judgment to the Son,","23":"that all may honor the Son, just as they honor the Father. Whoever does not honor the Son does not honor the Father who sent him.","24":"Truly, truly, I say to you, whoever hears my word and believes him who sent me has eternal life. He does not come into judgment, but has passed from death to life.","25":"“Truly, truly, I say to you, an hour is coming, and is now here, when the dead will hear the voice of the Son of God, and those who hear will live.","26":"For as the Father has life in himself, so he has granted the Son also to have life in himself.","27":"And he has given him authority to execute judgment, because he is the Son of Man.","28":"Do not marvel at this, for an hour is coming when all who are in the tombs will hear his voice","29":"and come out, those who have done good to the resurrection of life, and those who have done evil to the resurrection of judgment.","30":"“I can do nothing on my own. As I hear, I judge, and my judgment is just, because I seek not my own will but the will of him who sent me.","31":"If I alone bear witness about myself, my testimony is not true.","32":"There is another who bears witness about me, and I know that the testimony that he bears about me is true.","33":"You sent to John, and he has borne witness to the truth.","34":"Not that the testimony that I receive is from man, but I say these things so that you may be saved.","35":"He was a burning and shining lamp, and you were willing to rejoice for a while in his light.","36":"But the testimony that I have is greater than that of John. For the works that the Father has given me to accomplish, the very works that I am doing, bear witness about me that the Father has sent me.","37":"And the Father who sent me has himself borne witness about me. His voice you have never heard, his form you have never seen,","38":"and you do not have his word abiding in you, for you do not believe the one whom he has sent.","39":"You search the Scriptures because you think that in them you have eternal life; and it is they that bear witness about me,","40":"yet you refuse to come to me that you may have life.","41":"I do not receive glory from people.","42":"But I know that you do not have the love of God within you.","43":"I have come in my Father’s name, and you do not receive me. If another comes in his own name, you will receive him.","44":"How can you believe, when you receive glory from one another and do not seek the glory that comes from the only God?","45":"Do not think that I will accuse you to the Father. There is one who accuses you: Moses, on whom you have set your hope.","46":"For if you believed Moses, you would believe me; for he wrote of me.","47":"But if you do not believe his writings, how will you believe my words?”"},"6":{"1":"After this Jesus went away to the other side of the Sea of Galilee, which is the Sea of Tiberias.","2":"And a large crowd was following him, because they saw the signs that he was doing on the sick.","3":"Jesus went up on the mountain, and there he sat down with his disciples.","4":"Now the Passover, the feast of the Jews, was at hand.","5":"Lifting up his eyes, then, and seeing that a large crowd was coming toward him, Jesus said to Philip, “Where are we to buy bread, so that these people may eat?”","6":"He said this to test him, for he himself knew what he would do.","7":"Philip answered him, “Two hundred denarii worth of bread would not be enough for each of them to get a little.”","8":"One of his disciples, Andrew, Simon Peter’s brother, said to him,","9":"“There is a boy here who has five barley loaves and two fish, but what are they for so many?”","10":"Jesus said, “Have the people sit down.” Now there was much grass in the place. So the men sat down, about five thousand in number.","11":"Jesus then took the loaves, and when he had given thanks, he distributed them to those who were seated. So also the fish, as much as they wanted.","12":"And when they had eaten their fill, he told his disciples, “Gather up the leftover fragments, that nothing may be lost.”","13":"So they gathered them up and filled twelve baskets with fragments from the five barley loaves left by those who had eaten.","14":"When the people saw the sign that he had done, they said, “This is indeed the Prophet who is to come into the world!”","15":"Perceiving then that they were about to come and take him by force to make him king, Jesus withdrew again to the mountain by himself.","16":"When evening came, his disciples went down to the sea,","17":"got into a boat, and started across the sea to Capernaum. It was now dark, and Jesus had not yet come to them.","18":"The sea became rough because a strong wind was blowing.","19":"When they had rowed about three or four miles, they saw Jesus walking on the sea and coming near the boat, and they were frightened.","20":"But he said to them, “It is I; do not be afraid.”","21":"Then they were glad to take him into the boat, and immediately the boat was at the land to which they were going.","22":"On the next day the crowd that remained on the other side of the sea saw that there had been only one boat there, and that Jesus had not entered the boat with his disciples, but that his disciples had gone away alone.","23":"Other boats from Tiberias came near the place where they had eaten the bread after the Lord had given thanks.","24":"So when the crowd saw that Jesus was not there, nor his disciples, they themselves got into the boats and went to Capernaum, seeking Jesus.","25":"When they found him on the other side of the sea, they said to him, “Rabbi, when did you come here?”","26":"Jesus answered them, “Truly, truly, I say to you, you are seeking me, not because you saw signs, but because you ate your fill of the loaves.","27":"Do not work for the food that perishes, but for the food that endures to eternal life, which the Son of Man will give to you. For on him God the Father has set his seal.”","28":"Then they said to him, “What must we do, to be doing the works of God?”","29":"Jesus answered them, “This is the work of God, that you believe in him whom he has sent.”","30":"So they said to him, “Then what sign do you do, that we may see and believe you? What work do you perform?","31":"Our fathers ate the manna in the wilderness; as it is written, ‘He gave them bread from heaven to eat.’”","32":"Jesus then said to them, “Truly, truly, I say to you, it was not Moses who gave you the bread from heaven, but my Father gives you the true bread from heaven.","33":"For the bread of God is he who comes down from heaven and gives life to the world.”","34":"They said to him, “Sir, give us this bread always.”","35":"Jesus said to them, “I am the bread of life; whoever comes to me shall not hunger, and whoever believes in me shall never thirst.","36":"But I said to you that you have seen me and yet do not believe.","37":"All that the Father gives me will come to me, and whoever comes to me I will never cast out.","38":"For I have come down from heaven, not to do my own will but the will of him who sent me.","39":"And this is the will of him who sent me, that I should lose nothing of all that he has given me, but raise it up on the last day.","40":"For this is the will of my Father, that everyone who looks on the Son and believes in him should have eternal life, and I will raise him up on the last day.”","41":"So the Jews grumbled about him, because he said, “I am the bread that came down from heaven.”","42":"They said, “Is not this Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”","43":"Jesus answered them, “Do not grumble among yourselves.","44":"No one can come to me unless the Father who sent me draws him. And I will raise him up on the last day.","45":"It is written in the Prophets, ‘And they will all be taught by God.’ Everyone who has heard and learned from the Father comes to me—","46":"not that anyone has seen the Father except he who is from God; he has seen the Father.","47":"Truly, truly, I say to you, whoever believes has eternal life.","48":"I am the bread of life.","49":"Your fathers ate the manna in the wilderness, and they died.","50":"This is the bread that comes down from heaven, so that one may eat of it and not die.","51":"I am the living bread that came down from heaven. If anyone eats of this bread, he will live forever. And the bread that I will give for the life of the world is my flesh.”","52":"The Jews then disputed among themselves, saying, “How can this man give us his flesh to eat?”","53":"So Jesus said to them, “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood, you have no life in you.","54":"Whoever feeds on my flesh and drinks my blood has eternal life, and I will raise him up on the last day.","55":"For my flesh is true food, and my blood is true drink.","56":"Whoever feeds on my flesh and drinks my blood abides in me, and I in him.","57":"As the living Father sent me, and I live because of the Father, so whoever feeds on me, he also will live because of me.","58":"This is the bread that came down from heaven, not like the bread the fathers ate, and died. Whoever feeds on this bread will live forever.”","59":"Jesus said these things in the synagogue, as he taught at Capernaum.","60":"When many of his disciples heard it, they said, “This is a hard saying; who can listen to it?”","61":"But Jesus, knowing in himself that his disciples were grumbling about this, said to them, “Do you take offense at this?","62":"Then what if you were to see the Son of Man ascending to where he was before?","63":"It is the Spirit who gives life; the flesh is no help at all. The words that I have spoken to you are spirit and life.","64":"But there are some of you who do not believe.” (For Jesus knew from the beginning who those were who did not believe, and who it was who would betray him.)","65":"And he said, “This is why I told you that no one can come to me unless it is granted him by the Father.”","66":"After this many of his disciples turned back and no longer walked with him.","67":"So Jesus said to the twelve, “Do you want to go away as well?”","68":"Simon Peter answered him, “Lord, to whom shall we go? You have the words of eternal life,","69":"and we have believed, and have come to know, that you are the Holy One of God.”","70":"Jesus answered them, “Did I not choose you, the twelve? And yet one of you is a devil.”","71":"He spoke of Judas the son of Simon Iscariot, for he, one of the twelve, was going to betray him."},"7":{"1":"After this Jesus went about in Galilee. He would not go about in Judea, because the Jews were seeking to kill him.","2":"Now the Jews’ Feast of Booths was at hand.","3":"So his brothers said to him, “Leave here and go to Judea, that your disciples also may see the works you are doing.","4":"For no one works in secret if he seeks to be known openly. If you do these things, show yourself to the world.”","5":"For not even his brothers believed in him.","6":"Jesus said to them, “My time has not yet come, but your time is always here.","7":"The world cannot hate you, but it hates me because I testify about it that its works are evil.","8":"You go up to the feast. I am not going up to this feast, for my time has not yet fully come.”","9":"After saying this, he remained in Galilee.","10":"But after his brothers had gone up to the feast, then he also went up, not publicly but in private.","11":"The Jews were looking for him at the feast, and saying, “Where is he?”","12":"And there was much muttering about him among the people. While some said, “He is a good man,” others said, “No, he is leading the people astray.”","13":"Yet for fear of the Jews no one spoke openly of him.","14":"About the middle of the feast Jesus went up into the temple and began teaching.","15":"The Jews therefore marveled, saying, “How is it that this man has learning, when he has never studied?”","16":"So Jesus answered them, “My teaching is not mine, but his who sent me.","17":"If anyone’s will is to do God’s will, he will know whether the teaching is from God or whether I am speaking on my own authority.","18":"The one who speaks on his own authority seeks his own glory; but the one who seeks the glory of him who sent him is true, and in him there is no falsehood.","19":"Has not Moses given you the law? Yet none of you keeps the law. Why do you seek to kill me?”","20":"The crowd answered, “You have a demon! Who is seeking to kill you?”","21":"Jesus answered them, “I did one work, and you all marvel at it.","22":"Moses gave you circumcision (not that it is from Moses, but from the fathers), and you circumcise a man on the Sabbath.","23":"If on the Sabbath a man receives circumcision, so that the law of Moses may not be broken, are you angry with me because on the Sabbath I made a man’s whole body well?","24":"Do not judge by appearances, but judge with right judgment.”","25":"Some of the people of Jerusalem therefore said, “Is not this the man whom they seek to kill?","26":"And here he is, speaking openly, and they say nothing to him! Can it be that the authorities really know that this is the Christ?","27":"But we know where this man comes from, and when the Christ appears, no one will know where he comes from.”","28":"So Jesus proclaimed, as he taught in the temple, “You know me, and you know where I come from. But I have not come of my own accord. He who sent me is true, and him you do not know.","29":"I know him, for I come from him, and he sent me.”","30":"So they were seeking to arrest him, but no one laid a hand on him, because his hour had not yet come.","31":"Yet many of the people believed in him. They said, “When the Christ appears, will he do more signs than this man has done?”","32":"The Pharisees heard the crowd muttering these things about him, and the chief priests and Pharisees sent officers to arrest him.","33":"Jesus then said, “I will be with you a little longer, and then I am going to him who sent me.","34":"You will seek me and you will not find me. Where I am you cannot come.”","35":"The Jews said to one another, “Where does this man intend to go that we will not find him? Does he intend to go to the Dispersion among the Greeks and teach the Greeks?","36":"What does he mean by saying, ‘You will seek me and you will not find me,’ and, ‘Where I am you cannot come’?”","37":"On the last day of the feast, the great day, Jesus stood up and cried out, “If anyone thirsts, let him come to me and drink.","38":"Whoever believes in me, as the Scripture has said, ‘Out of his heart will flow rivers of living water.’”","39":"Now this he said about the Spirit, whom those who believed in him were to receive, for as yet the Spirit had not been given, because Jesus was not yet glorified.","40":"When they heard these words, some of the people said, “This really is the Prophet.”","41":"Others said, “This is the Christ.” But some said, “Is the Christ to come from Galilee?","42":"Has not the Scripture said that the Christ comes from the offspring of David, and comes from Bethlehem, the village where David was?”","43":"So there was a division among the people over him.","44":"Some of them wanted to arrest him, but no one laid hands on him.","45":"The officers then came to the chief priests and Pharisees, who said to them, “Why did you not bring him?”","46":"The officers answered, “No one ever spoke like this man!”","47":"The Pharisees answered them, “Have you also been deceived?","48":"Have any of the authorities or the Pharisees believed in him?","49":"But this crowd that does not know the law is accursed.”","50":"Nicodemus, who had gone to him before, and who was one of them, said to them,","51":"“Does our law judge a man without first giving him a hearing and learning what he does?”","52":"They replied, “Are you from Galilee too? Search and see that no prophet arises from Galilee.”","53":"They went each to his own house,"},"8":{"1":"but Jesus went to the Mount of Olives.","2":"Early in the morning he came again to the temple. All the people came to him, and he sat down and taught them.","3":"The scribes and the Pharisees brought a woman who had been caught in adultery, and placing her in the midst","4":"they said to him, “Teacher, this woman has been caught in the act of adultery.","5":"Now in the Law, Moses commanded us to stone such women. So what do you say?”","6":"This they said to test him, that they might have some charge to bring against him. Jesus bent down and wrote with his finger on the ground.","7":"And as they continued to ask him, he stood up and said to them, “Let him who is without sin among you be the first to throw a stone at her.”","8":"And once more he bent down and wrote on the ground.","9":"But when they heard it, they went away one by one, beginning with the older ones, and Jesus was left alone with the woman standing before him.","10":"Jesus stood up and said to her, “Woman, where are they? Has no one condemned you?”","11":"She said, “No one, Lord.” And Jesus said, “Neither do I condemn you; go, and from now on sin no more.”","12":"Again Jesus spoke to them, saying, “I am the light of the world. Whoever follows me will not walk in darkness, but will have the light of life.”","13":"So the Pharisees said to him, “You are bearing witness about yourself; your testimony is not true.”","14":"Jesus answered, “Even if I do bear witness about myself, my testimony is true, for I know where I came from and where I am going, but you do not know where I come from or where I am going.","15":"You judge according to the flesh; I judge no one.","16":"Yet even if I do judge, my judgment is true, for it is not I alone who judge, but I and the Father who sent me.","17":"In your Law it is written that the testimony of two people is true.","18":"I am the one who bears witness about myself, and the Father who sent me bears witness about me.”","19":"They said to him therefore, “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”","20":"These words he spoke in the treasury, as he taught in the temple; but no one arrested him, because his hour had not yet come.","21":"So he said to them again, “I am going away, and you will seek me, and you will die in your sin. Where I am going, you cannot come.”","22":"So the Jews said, “Will he kill himself, since he says, ‘Where I am going, you cannot come’?”","23":"He said to them, “You are from below; I am from above. You are of this world; I am not of this world.","24":"I told you that you would die in your sins, for unless you believe that I am he you will die in your sins.”","25":"So they said to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.","26":"I have much to say about you and much to judge, but he who sent me is true, and I declare to the world what I have heard from him.”","27":"They did not understand that he had been speaking to them about the Father.","28":"So Jesus said to them, “When you have lifted up the Son of Man, then you will know that I am he, and that I do nothing on my own authority, but speak just as the Father taught me.","29":"And he who sent me is with me. He has not left me alone, for I always do the things that are pleasing to him.”","30":"As he was saying these things, many believed in him.","31":"So Jesus said to the Jews who had believed him, “If you abide in my word, you are truly my disciples,","32":"and you will know the truth, and the truth will set you free.”","33":"They answered him, “We are offspring of Abraham and have never been enslaved to anyone. How is it that you say, ‘You will become free’?”","34":"Jesus answered them, “Truly, truly, I say to you, everyone who practices sin is a slave to sin.","35":"The slave does not remain in the house forever; the son remains forever.","36":"So if the Son sets you free, you will be free indeed.","37":"I know that you are offspring of Abraham; yet you seek to kill me because my word finds no place in you.","38":"I speak of what I have seen with my Father, and you do what you have heard from your father.”","39":"They answered him, “Abraham is our father.” Jesus said to them, “If you were Abraham’s children, you would be doing the works Abraham did,","40":"but now you seek to kill me, a man who has told you the truth that I heard from God. This is not what Abraham did.","41":"You are doing the works your father did.” They said to him, “We were not born of sexual immorality. We have one Father—even God.”","42":"Jesus said to them, “If God were your Father, you would love me, for I came from God and I am here. I came not of my own accord, but he sent me.","43":"Why do you not understand what I say? It is because you cannot bear to hear my word.","44":"You are of your father the devil, and your will is to do your father’s desires. He was a murderer from the beginning, and does not stand in the truth, because there is no truth in him. When he lies, he speaks out of his own character, for he is a liar and the father of lies.","45":"But because I tell the truth, you do not believe me.","46":"Which one of you convicts me of sin? If I tell the truth, why do you not believe me?","47":"Whoever is of God hears the words of God. The reason why you do not hear them is that you are not of God.”","48":"The Jews answered him, “Are we not right in saying that you are a Samaritan and have a demon?”","49":"Jesus answered, “I do not have a demon, but I honor my Father, and you dishonor me.","50":"Yet I do not seek my own glory; there is One who seeks it, and he is the judge.","51":"Truly, truly, I say to you, if anyone keeps my word, he will never see death.”","52":"The Jews said to him, “Now we know that you have a demon! Abraham died, as did the prophets, yet you say, ‘If anyone keeps my word, he will never taste death.’","53":"Are you greater than our father Abraham, who died? And the prophets died! Who do you make yourself out to be?”","54":"Jesus answered, “If I glorify myself, my glory is nothing. It is my Father who glorifies me, of whom you say, ‘He is our God.’","55":"But you have not known him. I know him. If I were to say that I do not know him, I would be a liar like you, but I do know him and I keep his word.","56":"Your father Abraham rejoiced that he would see my day. He saw it and was glad.”","57":"So the Jews said to him, “You are not yet fifty years old, and have you seen Abraham?”","58":"Jesus said to them, “Truly, truly, I say to you, before Abraham was, I am.”","59":"So they picked up stones to throw at him, but Jesus hid himself and went out of the temple."},"9":{"1":"As he passed by, he saw a man blind from birth.","2":"And his disciples asked him, “Rabbi, who sinned, this man or his parents, that he was born blind?”","3":"Jesus answered, “It was not that this man sinned, or his parents, but that the works of God might be displayed in him.","4":"We must work the works of him who sent me while it is day; night is coming, when no one can work.","5":"As long as I am in the world, I am the light of the world.”","6":"Having said these things, he spit on the ground and made mud with the saliva. Then he anointed the man’s eyes with the mud","7":"and said to him, “Go, wash in the pool of Siloam” (which means Sent). So he went and washed and came back seeing.","8":"The neighbors and those who had seen him before as a beggar were saying, “Is this not the man who used to sit and beg?”","9":"Some said, “It is he.” Others said, “No, but he is like him.” He kept saying, “I am the man.”","10":"So they said to him, “Then how were your eyes opened?”","11":"He answered, “The man called Jesus made mud and anointed my eyes and said to me, ‘Go to Siloam and wash.’ So I went and washed and received my sight.”","12":"They said to him, “Where is he?” He said, “I do not know.”","13":"They brought to the Pharisees the man who had formerly been blind.","14":"Now it was a Sabbath day when Jesus made the mud and opened his eyes.","15":"So the Pharisees again asked him how he had received his sight. And he said to them, “He put mud on my eyes, and I washed, and I see.”","16":"Some of the Pharisees said, “This man is not from God, for he does not keep the Sabbath.” But others said, “How can a man who is a sinner do such signs?” And there was a division among them.","17":"So they said again to the blind man, “What do you say about him, since he has opened your eyes?” He said, “He is a prophet.”","18":"The Jews did not believe that he had been blind and had received his sight, until they called the parents of the man who had received his sight","19":"and asked them, “Is this your son, who you say was born blind? How then does he now see?”","20":"His parents answered, “We know that this is our son and that he was born blind.","21":"But how he now sees we do not know, nor do we know who opened his eyes. Ask him; he is of age. He will speak for himself.”","22":"(His parents said these things because they feared the Jews, for the Jews had already agreed that if anyone should confess Jesus to be Christ, he was to be put out of the synagogue.","23":"Therefore his parents said, “He is of age; ask him.”)","24":"So for the second time they called the man who had been blind and said to him, “Give glory to God. We know that this man is a sinner.”","25":"He answered, “Whether he is a sinner I do not know. One thing I do know, that though I was blind, now I see.”","26":"They said to him, “What did he do to you? How did he open your eyes?”","27":"He answered them, “I have told you already, and you would not listen. Why do you want to hear it again? Do you also want to become his disciples?”","28":"And they reviled him, saying, “You are his disciple, but we are disciples of Moses.","29":"We know that God has spoken to Moses, but as for this man, we do not know where he comes from.”","30":"The man answered, “Why, this is an amazing thing! You do not know where he comes from, and yet he opened my eyes.","31":"We know that God does not listen to sinners, but if anyone is a worshiper of God and does his will, God listens to him.","32":"Never since the world began has it been heard that anyone opened the eyes of a man born blind.","33":"If this man were not from God, he could do nothing.”","34":"They answered him, “You were born in utter sin, and would you teach us?” And they cast him out.","35":"Jesus heard that they had cast him out, and having found him he said, “Do you believe in the Son of Man?”","36":"He answered, “And who is he, sir, that I may believe in him?”","37":"Jesus said to him, “You have seen him, and it is he who is speaking to you.”","38":"He said, “Lord, I believe,” and he worshiped him.","39":"Jesus said, “For judgment I came into this world, that those who do not see may see, and those who see may become blind.”","40":"Some of the Pharisees near him heard these things, and said to him, “Are we also blind?”","41":"Jesus said to them, “If you were blind, you would have no guilt; but now that you say, ‘We see,’ your guilt remains."},"10":{"1":"“Truly, truly, I say to you, he who does not enter the sheepfold by the door but climbs in by another way, that man is a thief and a robber.","2":"But he who enters by the door is the shepherd of the sheep.","3":"To him the gatekeeper opens. The sheep hear his voice, and he calls his own sheep by name and leads them out.","4":"When he has brought out all his own, he goes before them, and the sheep follow him, for they know his voice.","5":"A stranger they will not follow, but they will flee from him, for they do not know the voice of strangers.”","6":"This figure of speech Jesus used with them, but they did not understand what he was saying to them.","7":"So Jesus again said to them, “Truly, truly, I say to you, I am the door of the sheep.","8":"All who came before me are thieves and robbers, but the sheep did not listen to them.","9":"I am the door. If anyone enters by me, he will be saved and will go in and out and find pasture.","10":"The thief comes only to steal and kill and destroy. I came that they may have life and have it abundantly.","11":"I am the good shepherd. The good shepherd lays down his life for the sheep.","12":"He who is a hired hand and not a shepherd, who does not own the sheep, sees the wolf coming and leaves the sheep and flees, and the wolf snatches them and scatters them.","13":"He flees because he is a hired hand and cares nothing for the sheep.","14":"I am the good shepherd. I know my own and my own know me,","15":"just as the Father knows me and I know the Father; and I lay down my life for the sheep.","16":"And I have other sheep that are not of this fold. I must bring them also, and they will listen to my voice. So there will be one flock, one shepherd.","17":"For this reason the Father loves me, because I lay down my life that I may take it up again.","18":"No one takes it from me, but I lay it down of my own accord. I have authority to lay it down, and I have authority to take it up again. This charge I have received from my Father.”","19":"There was again a division among the Jews because of these words.","20":"Many of them said, “He has a demon, and is insane; why listen to him?”","21":"Others said, “These are not the words of one who is oppressed by a demon. Can a demon open the eyes of the blind?”","22":"At that time the Feast of Dedication took place at Jerusalem. It was winter,","23":"and Jesus was walking in the temple, in the colonnade of Solomon.","24":"So the Jews gathered around him and said to him, “How long will you keep us in suspense? If you are the Christ, tell us plainly.”","25":"Jesus answered them, “I told you, and you do not believe. The works that I do in my Father’s name bear witness about me,","26":"but you do not believe because you are not among my sheep.","27":"My sheep hear my voice, and I know them, and they follow me.","28":"I give them eternal life, and they will never perish, and no one will snatch them out of my hand.","29":"My Father, who has given them to me, is greater than all, and no one is able to snatch them out of the Father’s hand.","30":"I and the Father are one.”","31":"The Jews picked up stones again to stone him.","32":"Jesus answered them, “I have shown you many good works from the Father; for which of them are you going to stone me?”","33":"The Jews answered him, “It is not for a good work that we are going to stone you but for blasphemy, because you, being a man, make yourself God.”","34":"Jesus answered them, “Is it not written in your Law, ‘I said, you are gods’?","35":"If he called them gods to whom the word of God came—and Scripture cannot be broken—","36":"do you say of him whom the Father consecrated and sent into the world, ‘You are blaspheming,’ because I said, ‘I am the Son of God’?","37":"If I am not doing the works of my Father, then do not believe me;","38":"but if I do them, even though you do not believe me, believe the works, that you may know and understand that the Father is in me and I am in the Father.”","39":"Again they sought to arrest him, but he escaped from their hands.","40":"He went away again across the Jordan to the place where John had been baptizing at first, and there he remained.","41":"And many came to him. And they said, “John did no sign, but everything that John said about this man was true.”","42":"And many believed in him there."},"11":{"1":"Now a certain man was ill, Lazarus of Bethany, the village of Mary and her sister Martha.","2":"It was Mary who anointed the Lord with ointment and wiped his feet with her hair, whose brother Lazarus was ill.","3":"So the sisters sent to him, saying, “Lord, he whom you love is ill.”","4":"But when Jesus heard it he said, “This illness does not lead to death. It is for the glory of God, so that the Son of God may be glorified through it.”","5":"Now Jesus loved Martha and her sister and Lazarus.","6":"So, when he heard that Lazarus was ill, he stayed two days longer in the place where he was.","7":"Then after this he said to the disciples, “Let us go to Judea again.”","8":"The disciples said to him, “Rabbi, the Jews were just now seeking to stone you, and are you going there again?”","9":"Jesus answered, “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble, because he sees the light of this world.","10":"But if anyone walks in the night, he stumbles, because the light is not in him.”","11":"After saying these things, he said to them, “Our friend Lazarus has fallen asleep, but I go to awaken him.”","12":"The disciples said to him, “Lord, if he has fallen asleep, he will recover.”","13":"Now Jesus had spoken of his death, but they thought that he meant taking rest in sleep.","14":"Then Jesus told them plainly, “Lazarus has died,","15":"and for your sake I am glad that I was not there, so that you may believe. But let us go to him.”","16":"So Thomas, called the Twin, said to his fellow disciples, “Let us also go, that we may die with him.”","17":"Now when Jesus came, he found that Lazarus had already been in the tomb four days.","18":"Bethany was near Jerusalem, about two miles off,","19":"and many of the Jews had come to Martha and Mary to console them concerning their brother.","20":"So when Martha heard that Jesus was coming, she went and met him, but Mary remained seated in the house.","21":"Martha said to Jesus, “Lord, if you had been here, my brother would not have died.","22":"But even now I know that whatever you ask from God, God will give you.”","23":"Jesus said to her, “Your brother will rise again.”","24":"Martha said to him, “I know that he will rise again in the resurrection on the last day.”","25":"Jesus said to her, “I am the resurrection and the life. Whoever believes in me, though he die, yet shall he live,","26":"and everyone who lives and believes in me shall never die. Do you believe this?”","27":"She said to him, “Yes, Lord; I believe that you are the Christ, the Son of God, who is coming into the world.”","28":"When she had said this, she went and called her sister Mary, saying in private, “The Teacher is here and is calling for you.”","29":"And when she heard it, she rose quickly and went to him.","30":"Now Jesus had not yet come into the village, but was still in the place where Martha had met him.","31":"When the Jews who were with her in the house, consoling her, saw Mary rise quickly and go out, they followed her, supposing that she was going to the tomb to weep there.","32":"Now when Mary came to where Jesus was and saw him, she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”","33":"When Jesus saw her weeping, and the Jews who had come with her also weeping, he was deeply moved in his spirit and greatly troubled.","34":"And he said, “Where have you laid him?” They said to him, “Lord, come and see.”","35":"Jesus wept.","36":"So the Jews said, “See how he loved him!”","37":"But some of them said, “Could not he who opened the eyes of the blind man also have kept this man from dying?”","38":"Then Jesus, deeply moved again, came to the tomb. It was a cave, and a stone lay against it.","39":"Jesus said, “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by this time there will be an odor, for he has been dead four days.”","40":"Jesus said to her, “Did I not tell you that if you believed you would see the glory of God?”","41":"So they took away the stone. And Jesus lifted up his eyes and said, “Father, I thank you that you have heard me.","42":"I knew that you always hear me, but I said this on account of the people standing around, that they may believe that you sent me.”","43":"When he had said these things, he cried out with a loud voice, “Lazarus, come out.”","44":"The man who had died came out, his hands and feet bound with linen strips, and his face wrapped with a cloth. Jesus said to them, “Unbind him, and let him go.”","45":"Many of the Jews therefore, who had come with Mary and had seen what he did, believed in him,","46":"but some of them went to the Pharisees and told them what Jesus had done.","47":"So the chief priests and the Pharisees gathered the council and said, “What are we to do? For this man performs many signs.","48":"If we let him go on like this, everyone will believe in him, and the Romans will come and take away both our place and our nation.”","49":"But one of them, Caiaphas, who was high priest that year, said to them, “You know nothing at all.","50":"Nor do you understand that it is better for you that one man should die for the people, not that the whole nation should perish.”","51":"He did not say this of his own accord, but being high priest that year he prophesied that Jesus would die for the nation,","52":"and not for the nation only, but also to gather into one the children of God who are scattered abroad.","53":"So from that day on they made plans to put him to death.","54":"Jesus therefore no longer walked openly among the Jews, but went from there to the region near the wilderness, to a town called Ephraim, and there he stayed with the disciples.","55":"Now the Passover of the Jews was at hand, and many went up from the country to Jerusalem before the Passover to purify themselves.","56":"They were looking for Jesus and saying to one another as they stood in the temple, “What do you think? That he will not come to the feast at all?”","57":"Now the chief priests and the Pharisees had
