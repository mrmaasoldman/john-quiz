<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1030">
<title>Coach Dashboard</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Jersey+15&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#0b1030;--bg2:#121a46;--card:#161f52;--tile:#0e1640;--line:#2c3a86;--ink:#f4f1e6;--muted:#a9b3e0;--gold:#ffd23f;--good:#58e08c;--bad:#ff6b5a;--warn:#ffb347;--accent:#4fc3f7;
  --f-head:'Pixelify Sans',system-ui,sans-serif;--f-body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;--f-num:'Jersey 15','Pixelify Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
body{background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:18px 18px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;line-height:1.2}
h1{font-size:clamp(22px,4vw,30px)}h2{font-size:20px}h3{font-size:17px}
.label{font-family:var(--f-head);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}.hint{color:var(--muted);font-size:14px}
.card{background:var(--card);border:3px solid var(--line);box-shadow:5px 5px 0 rgba(0,0,0,.45);padding:16px;display:grid;gap:12px}
.btn{background:var(--gold);color:#1a1300;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:9px 16px;font-family:var(--f-head);font-weight:700;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}
input[type=text],input[type=password],select{background:var(--tile);border:3px solid var(--line);padding:10px 12px;color:var(--ink);min-width:0}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.signin{max-width:440px;margin:12vh auto 0}
.err{color:var(--bad);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--tile);border:2px solid var(--line);padding:10px 12px;display:grid;gap:2px}
.tile b{font-family:var(--f-num);font-size:34px;line-height:1;color:var(--gold);font-weight:400}
.tile span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin:16px 0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.nudge{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tile);border:2px solid var(--line);padding:4px 10px 4px 4px;cursor:pointer}
.chip small{color:var(--warn)}
.tblwrap{overflow-x:auto;border:2px solid var(--line);background:var(--tile)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-family:var(--f-head);font-size:13px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--bg2);cursor:pointer;user-select:none}
th[aria-sort=descending]::after{content:' ▼';color:var(--gold)}th[aria-sort=ascending]::after{content:' ▲';color:var(--gold)}
td.n{font-family:var(--f-num);font-size:22px;line-height:1}
tbody tr{cursor:pointer}tbody tr:hover{background:rgba(255,255,255,.05)}
td.who,th.who{position:sticky;left:0;background:var(--tile);z-index:1}th.who{background:var(--bg2);z-index:2}
tbody tr:hover td.who{background:#18225a}
.who .nm{display:inline-flex;align-items:center;gap:10px}
.who b{font-weight:700}.who small{display:block;color:var(--muted);font-size:12px}
.av{display:inline-block;flex:none;outline:2px solid #000;image-rendering:pixelated}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}
.bar{height:8px;background:rgba(0,0,0,.4);min-width:70px}.bar i{display:block;height:100%;background:var(--good)}
.spark{display:inline-block;vertical-align:middle;margin-left:8px}
.modal{position:fixed;inset:0;background:rgba(3,6,24,.78);z-index:20;overflow:auto;padding:24px 12px}
.modal .card{max-width:900px;margin:0 auto}
.dhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chtbl{min-width:560px}
.chtbl td,.chtbl th{padding:6px 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.empty{padding:20px;text-align:center;color:var(--muted)}
footer{margin-top:24px;color:var(--muted);font-size:13px}
</style>
</head>

let dayFmt=null; try{ dayFmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}); }catch(e){}
function dayKey(d){ d=d||new Date(); if(dayFmt){ try{ const p={}; dayFmt.formatToParts(d).forEach(x=>p[x.type]=x.value); return p.year+'-'+p.month+'-'+p.day; }catch(e){} }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shiftDay(k,n){ const [y,m,d]=k.split('-').map(Number), t=new Date(Date.UTC(y,m-1,d+n)); return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0'); }

function series(str,td,today){ if(!str||!td) return null; const a=str.split(',').map(Number); if(a.length!==28||a.some(isNaN)) return null;
  const gap=daysBetween(td,today); if(gap<0) return a; if(gap>=28) return Array(28).fill(0); return a.slice(gap).concat(Array(gap).fill(0)); }
function derive(q,today){
  const qh=series(q.qh,q.td,today), sh=series(q.sh,q.td,today), xh=series(q.xh,q.td,today);
  const sum=(a,n)=>a?a.slice(-n).reduce((s,v)=>s+v,0):null;
  const has=!!qh;
  let lastDay=null; if(qh){ for(let i=27;i>=0;i--) if(qh[i]>0){ lastDay=shiftDay(today,i-27); break; } }
  if(!lastDay&&q.td&&q.today>0) lastDay=q.td;
  const chs=(q.ch||'').split(',').map(s=>s.split('.').map(Number)).filter(a=>a.length===4&&!a.some(isNaN));
  return Object.assign({},q,{has,qh,sh,xh,lastDay,
    since:lastDay?daysBetween(lastDay,today):null,
    q0:q.td===today?q.today:0, q7:has?sum(qh,7):(q.td===today?q.today:null), q28:sum(qh,28),
    s7:sum(sh,7), a7:qh?qh.slice(-7).filter(v=>v>0).length:null,
    xw:q.wk===weekKey(today)?q.xw:0, acc:q.att?pct(q.right,q.att):null, chs:chs.length===21?chs:null});
}

      <td class="n">${(q.xw||0).toLocaleString()}</td>
      <td class="n ${q.acc==null?'':q.acc>=85?'g':q.acc>=65?'w':'b'}">${q.acc==null?'–':q.acc+'%'}</td>
      <td><span class="n" style="font-family:var(--f-num);font-size:22px">${q.solid}</span> <span class="hint">/ ${TOTAL_Q}</span></td>
      <td><span class="n" style="font-family:var(--f-num);font-size:22px">${q.mem}</span>${q.goalPct?` <span class="hint">· ${Math.round(q.goalPct*100)}% of goal</span>`:''}</td>
      <td class="n">${q.level}</td></tr>`).join('')}</tbody></table></div>
    ${noHist?`<span class="hint">“–” means that quizzer hasn't practiced since the study site started sending daily history. It fills in the next time they practice.</span>`:''}
  </div>`}
  <footer>Practice time counts time spent answering in Practice and Verse Cards (games aren't timed). Questions include games. Days run midnight to midnight Central time. Updated ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}.</footer>
  ${sel?detailView(qs.find(q=>q.name===sel),today):''}`;
}
function detailView(q,today){ if(!q) return '';
  const tile=(v,l)=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="modal" id="modal"><div class="card" role="dialog" aria-modal="true" aria-label="${esc(q.name)}">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div class="dhead">${avSvg(q.av||avDefault(q.name),64,q.name)}<div><h2>${esc(q.name)}</h2><span class="hint">${esc(q.team||'No team')} · Level ${q.level} · ${q.xp.toLocaleString()} XP · Last practiced: ${lastTxt(q)}</span></div></div>
      <button class="btn ghost" id="close">Close</button></div>
    <div class="tiles">
      ${tile(q.q0,'Questions today')}${tile(q.q7==null?'–':q.q7,'Questions, 7 days')}${tile(q.q28==null?'–':q.q28,'Questions, 28 days')}${tile(q.s7==null?'–':fmtMin(q.s7),'Practice time, 7 days')}
      ${tile(q.att.toLocaleString(),'Questions answered (all)')}${tile(q.acc==null?'–':q.acc+'%','Accuracy')}${tile(q.solid+'<small style="font-size:.5em;color:var(--muted)"> / '+TOTAL_Q+'</small>','Questions mastered')}
      ${tile(q.mem,'Verses memorized'+(q.goalPct?' · '+Math.round(q.goalPct*100)+'% of goal':''))}${tile(q.streak+' <small style="font-size:.5em;color:var(--muted)">best '+q.best+'</small>','Day streak')}
      ${tile(q.bosses+'/21','Bosses beaten')}${tile(q.speed,'Speed Round best')}${tile(q.vright,'Verse cards right')}${tile(q.badges,'Badges')}
    </div>
    ${q.goal&&q.goal!=='(no goal set)'?`<span class="hint">Memory goal: ${esc(q.goal)}</span>`:''}
    <div class="chart"><div class="row" style="justify-content:space-between"><span class="label">Questions per day · last 4 weeks</span></div>
      ${q.qh?barChart(q.qh,today,{label:'Questions per day',unit:'questions',h:140}):`<p class="hint">Daily history starts the next time ${esc(q.name)} practices.</p>`}</div>
    ${q.sh&&q.sh.some(v=>v)?`<div class="chart"><span class="label">Practice minutes per day</span>${barChart(q.sh.map(v=>Math.round(v/60)),today,{label:'Practice minutes per day',unit:'minutes',h:110})}</div>`:''}
    <div><span class="label">By chapter</span>
      ${q.chs?`<div class="tblwrap" style="margin-top:8px"><table class="chtbl"><thead><tr><th>Ch</th><th>Answers</th><th>Accuracy</th><th>Questions mastered</th><th>Verses memorized</th></tr></thead><tbody>
        ${q.chs.map((a,i)=>{const acc=a[0]?pct(a[1],a[0]):null, mp=pct(a[2],CHQ[i]), vp=pct(a[3],VERSES[i]);return `<tr style="cursor:default">
          <td class="n">${i+1}</td><td class="n">${a[0]}</td>
          <td class="n ${acc==null?'':acc>=85?'g':acc>=65?'w':'b'}">${acc==null?'–':acc+'%'}</td>
          <td><div class="row" style="flex-wrap:nowrap;gap:8px"><div class="bar" style="flex:1"><i style="width:${mp}%"></i></div><span class="hint">${a[2]}/${CHQ[i]}</span></div></td>
          <td><div class="row" style="flex-wrap:nowrap;gap:8px"><div class="bar" style="flex:1"><i style="width:${vp}%;background:var(--gold)"></i></div><span class="hint">${a[3]}/${VERSES[i]}</span></div></td></tr>`}).join('')}</tbody></table></div>`
        :`<p class="hint">Chapter details show up the next time ${esc(q.name)} practices.</p>`}
    </div>
  </div></div>`;
}

function render(){
  const app=$('#app'), y=scrollY;
  app.innerHTML=data?dashView():signinView();
  const f=$('#cform'); if(f){ const i=$('#ccode'); i.focus(); f.onsubmit=e=>{e.preventDefault(); const c=i.value.trim(); if(c) load(c);}; return; }
  const ts=$('#tsel'); if(ts) ts.onchange=()=>{team=ts.value; store.set('team',team||null); render();};
  $('#refresh').onclick=()=>load(code);
  $('#signout').onclick=()=>{ store.set('code',null); store.set('team',null); code=''; data=null; team=''; sel=null; err=''; render(); };
  document.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{ const k=th.dataset.sort; if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=(k==='name'||k==='since')?1:-1; } render(); });
  document.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{ sel=el.dataset.q; render(); });
  const m=$('#modal'); if(m){ $('#close').onclick=()=>{sel=null;render()}; m.onclick=e=>{ if(e.target===m){sel=null;render()} }; }
  scrollTo(0,y);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sel){ sel=null; render(); } });
render(); if(code) load(code);
})();
</script>
</body>
</html>
